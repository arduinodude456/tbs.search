name: Migrate Legacy Search Index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alten Index migrieren
        run: |
          python migrate_legacy.py

      - name: Suchindex erstellen
        run: |
          python build_index.py

      - name: Änderungen committen
        run: |
          git config user.name "TBS Search Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Migrate legacy search index"
            git push
          fi
