<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TBS Search</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #202124;
}

body {
    padding-bottom: 50px;
}

/* HEADER */

.header {
    width: 100%;
    padding: 30px 20px 12px;
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -2px;
    color: #202124;
    margin-bottom: 20px;
    cursor: pointer;
    user-select: none;
}

/* SUCHFELD */

.search-container {
    width: min(720px, 94vw);
    margin: auto;
    position: relative;
}

.search-box {
    width: 100%;
    height: 52px;
    border: 1px solid #dfe1e5;
    border-radius: 28px;
    padding: 0 55px 0 20px;
    font-size: 17px;
    outline: none;
    box-shadow: 0 2px 7px rgba(0,0,0,.08);
}

.search-box:focus {
    border-color: #aaa;
    box-shadow: 0 2px 10px rgba(0,0,0,.14);
}

.search-button {
    position: absolute;
    right: 8px;
    top: 7px;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: #202124;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.search-button:hover {
    background: #000;
}

/* TABS */

.tabs {
    width: min(900px,94vw);
    margin: 15px auto 0;
    display: flex;
    justify-content: center;
    gap: 5px;
    border-bottom: 1px solid #eee;
}

.tab {
    border: 0;
    background: transparent;
    color: #70757a;
    font-size: 14px;
    padding: 11px 20px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
}

.tab:hover,
.tab.active {
    color: #202124;
}

.tab.active {
    border-bottom-color: #202124;
    font-weight: 600;
}

/* STATUS */

.status {
    width: min(900px,94vw);
    margin: 18px auto 10px;
    color: #70757a;
    font-size: 13px;
    min-height: 18px;
}

/* ERGEBNISSE */

.results {
    width: min(900px,94vw);
    margin: auto;
}

.result {
    margin: 0 0 27px;
}

.result-title {
    display: block;
    font-size: 20px;
    color: #1a0dab;
    text-decoration: none;
    margin-bottom: 4px;
    overflow-wrap: anywhere;
}

.result-title:hover {
    text-decoration: underline;
}

.result-url {
    color: #188038;
    font-size: 14px;
    margin-bottom: 5px;
    overflow-wrap: anywhere;
}

.result-description {
    color: #4d5156;
    font-size: 14px;
    line-height: 1.5;
}

.result-description mark {
    background: #fff0a8;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
}

/* BILDER */

.image-results {
    width: min(1100px,96vw);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
    gap: 14px;
}

.image-card {
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    cursor: pointer;
    transition: transform .15s,box-shadow .15s;
}

.image-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,.12);
}

.image-wrapper {
    width: 100%;
    height: 180px;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.image-info {
    padding: 9px 10px 11px;
}

.image-title {
    font-size: 13px;
    font-weight: 600;
    color: #333;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.image-source {
    margin-top: 5px;
    font-size: 11px;
    color: #188038;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* IMAGE VIEWER */

.image-viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.88);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.image-viewer.visible {
    display: flex;
}

.viewer-content {
    max-width: 95vw;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.viewer-image {
    max-width: 95vw;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 5px;
}

.viewer-caption {
    margin-top: 12px;
    max-width: 90vw;
    color: white;
    text-align: center;
    font-size: 14px;
}

.viewer-source {
    margin-top: 6px;
    color: #ccc;
    font-size: 12px;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.viewer-close {
    position: fixed;
    top: 15px;
    right: 20px;
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    color: white;
    font-size: 25px;
    cursor: pointer;
}

/* ALLGEMEIN */

.empty {
    text-align: center;
    color: #70757a;
    margin-top: 45px;
    font-size: 16px;
}

.loading {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.spinner {
    width: 13px;
    height: 13px;
    border: 2px solid #ddd;
    border-top-color: #555;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.diagnostics {
    width: min(900px,94vw);
    margin: 25px auto;
    padding: 10px 12px;
    background: #f8f9fa;
    border-radius: 8px;
    color: #70757a;
    font-size: 11px;
    display: none;
}

.footer {
    text-align: center;
    color: #9aa0a6;
    font-size: 12px;
    margin-top: 60px;
}

@media(max-width:600px) {
    .header {
        padding-top: 20px;
    }

    .logo {
        font-size: 36px;
    }

    .search-box {
        height: 48px;
        font-size: 16px;
    }

    .result-title {
        font-size: 18px;
    }

    .image-results {
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 8px;
    }

    .image-wrapper {
        height: 140px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo" id="logo">
        TBS Search
    </div>

    <div class="search-container">

        <input
            id="searchInput"
            class="search-box"
            type="search"
            placeholder="Suchen..."
            autocomplete="off"
            spellcheck="false"
        >

        <button
            id="searchButton"
            class="search-button"
            aria-label="Suchen"
        >⌕</button>

    </div>

</header>

<nav class="tabs">

    <button
        id="webTab"
        class="tab active"
        type="button"
    >
        🌐 Web
    </button>

    <button
        id="imagesTab"
        class="tab"
        type="button"
    >
        🖼️ Bilder
    </button>

</nav>

<div id="status" class="status"></div>

<main id="webResults" class="results"></main>

<main
    id="imageResults"
    class="image-results"
    style="display:none"
></main>

<div id="diagnostics" class="diagnostics"></div>

<div class="footer">
    TBS Search
</div>

<div id="imageViewer" class="image-viewer">

    <button
        id="viewerClose"
        class="viewer-close"
        type="button"
        aria-label="Schließen"
    >×</button>

    <div class="viewer-content">

        <img
            id="viewerImage"
            class="viewer-image"
            alt=""
        >

        <div id="viewerCaption" class="viewer-caption"></div>

        <div id="viewerSource" class="viewer-source"></div>

    </div>

</div>

<script>
"use strict";

/* ============================================================
   TBS SEARCH v7
   RELEVANZ + WEB + BILDER
   ============================================================ */

const INDEX_ROOT = "data/index";
const TERMS_ROOT = INDEX_ROOT + "/terms";
const DOCS_ROOT = INDEX_ROOT + "/docs";

const MAX_RESULTS = 100;
const MAX_DOCUMENTS_TO_LOAD = 500;

const MAX_IMAGE_SOURCE_PAGES = 15;
const MAX_IMAGES_PER_PAGE = 8;
const MAX_TOTAL_IMAGES = 40;

const MAX_POSTINGS_PER_TERM = 400;


/* ============================================================
   CACHE
   ============================================================ */

const termCache = new Map();
const documentShardCache = new Map();
const pageImageCache = new Map();

let manifest = null;
let searchGeneration = 0;


/* ============================================================
   INDEXEDDB
   ============================================================ */

let dbPromise = null;

function openDatabase() {

    if (dbPromise) {
        return dbPromise;
    }

    dbPromise = new Promise(resolve => {

        if (!("indexedDB" in window)) {
            resolve(null);
            return;
        }

        const request =
            indexedDB.open(
                "TBS_Search_v7",
                1
            );

        request.onupgradeneeded = event => {

            const db = event.target.result;

            if (!db.objectStoreNames.contains("cache")) {

                db.createObjectStore(
                    "cache"
                );

            }

        };

        request.onsuccess = event => {
            resolve(event.target.result);
        };

        request.onerror = () => {
            resolve(null);
        };

    });

    return dbPromise;
}


async function dbGet(key) {

    const db = await openDatabase();

    if (!db) {
        return null;
    }

    return new Promise(resolve => {

        try {

            const transaction =
                db.transaction(
                    "cache",
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    "cache"
                );

            const request =
                store.get(key);

            request.onsuccess = () => {

                resolve(
                    request.result ?? null
                );

            };

            request.onerror = () => {
                resolve(null);
            };

        } catch {
            resolve(null);
        }

    });

}


async function dbSet(key,value) {

    const db = await openDatabase();

    if (!db) {
        return;
    }

    return new Promise(resolve => {

        try {

            const transaction =
                db.transaction(
                    "cache",
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "cache"
                );

            store.put(
                value,
                key
            );

            transaction.oncomplete = () => resolve();
            transaction.onerror = () => resolve();

        } catch {
            resolve();
        }

    });

}


/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */

function normalizeWord(word) {

    return String(word || "")
        .toLowerCase()
        .trim();

}


function tokenizeText(text) {

    return String(text || "")
        .toLowerCase()
        .match(/[a-zA-ZÀ-ÿ0-9]{2,}/g) || [];

}


function countTerm(tokens,term) {

    let count = 0;

    for (const token of tokens) {

        if (token === term) {
            count++;
        }

    }

    return count;
}


function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function highlightText(text,terms) {

    let escaped =
        escapeHTML(text);

    for (const term of terms) {

        if (!term || term.length < 2) {
            continue;
        }

        const escapedTerm =
            escapeHTML(term);

        try {

            escaped =
                escaped.replace(
                    new RegExp(
                        "(" +
                        escapedTerm.replace(
                            /[.*+?^${}()|[\]\\]/g,
                            "\\$&"
                        ) +
                        ")",
                        "gi"
                    ),
                    "<mark>$1</mark>"
                );

        } catch {
            /* ungültiger Suchbegriff */
        }

    }

    return escaped;
}


function documentShardName(docId) {

    const number =
        Number(docId);

    if (!Number.isFinite(number)) {
        return "00";
    }

    return (
        number % 256
    )
        .toString(16)
        .padStart(2,"0");

}


async function termShardName(term) {

    const normalized =
        normalizeWord(term);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode(
                normalized
            )
        );

    const bytes =
        new Uint8Array(hash);

    let hex = "";

    for (const byte of bytes) {

        hex += byte
            .toString(16)
            .padStart(2,"0");

    }

    return hex.substring(0,2);
}


function cacheBust(url) {

    return (
        url +
        (
            url.includes("?")
                ? "&"
                : "?"
        ) +
        "v=" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


async function fetchJSON(url) {

    const response =
        await fetch(
            cacheBust(url),
            {
                cache:"no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    return response.json();
}


/* ============================================================
   MANIFEST
   ============================================================ */

async function loadManifest() {

    const data =
        await fetchJSON(
            INDEX_ROOT +
            "/manifest.json"
        );

    manifest = data;

    await dbSet(
        "manifest",
        data
    );

    return data;
}


/* ============================================================
   TERM-SHARDS
   ============================================================ */

async function loadTermShard(term) {

    const normalized =
        normalizeWord(term);

    if (!normalized) {
        return [];
    }

    if (
        termCache.has(normalized)
    ) {
        return termCache.get(
            normalized
        );
    }

    const shard =
        await termShardName(
            normalized
        );

    const dbKey =
        "term:" + shard;

    let data =
        await dbGet(dbKey);

    if (!data) {

        try {

            data =
                await fetchJSON(
                    TERMS_ROOT +
                    "/" +
                    shard +
                    ".json"
                );

            await dbSet(
                dbKey,
                data
            );

        } catch {

            data = {};

        }

    }

    const result =
        Array.isArray(
            data[normalized]
        )
            ? data[normalized]
            : [];

    termCache.set(
        normalized,
        result
    );

    return result;
}


/* ============================================================
   DOKUMENT-SHARDS
   ============================================================ */

async function loadDocumentShard(shard) {

    if (
        documentShardCache.has(shard)
    ) {
        return documentShardCache.get(
            shard
        );
    }

    const dbKey =
        "docs:" + shard;

    let data =
        await dbGet(dbKey);

    if (!data) {

        try {

            data =
                await fetchJSON(
                    DOCS_ROOT +
                    "/" +
                    shard +
                    ".json"
                );

            await dbSet(
                dbKey,
                data
            );

        } catch {

            data = {};

        }

    }

    documentShardCache.set(
        shard,
        data
    );

    return data;
}


async function loadDocuments(ids) {

    if (
        !ids ||
        ids.length === 0
    ) {
        return [];
    }

    const limitedIds =
        ids
            .slice(
                0,
                MAX_DOCUMENTS_TO_LOAD
            )
            .map(Number);

    const groups = new Map();

    for (const id of limitedIds) {

        const shard =
            documentShardName(id);

        if (!groups.has(shard)) {
            groups.set(shard,[]);
        }

        groups
            .get(shard)
            .push(id);

    }

    const shardPromises =
        [...groups.keys()]
            .map(async shard => {

                const data =
                    await loadDocumentShard(
                        shard
                    );

                return {
                    shard,
                    data
                };

            });

    const shardResults =
        await Promise.all(
            shardPromises
        );

    const shardMap = new Map();

    for (const item of shardResults) {

        shardMap.set(
            item.shard,
            item.data
        );

    }

    const result = [];

    for (const id of limitedIds) {

        const shard =
            documentShardName(id);

        const data =
            shardMap.get(shard);

        if (!data) {
            continue;
        }

        const document =
            data[String(id)];

        if (document) {

            result.push({
                id,
                ...document
            });

        }

    }

    return result;
}


/* ============================================================
   RELEVANZ-RANKING
   ============================================================ */

function scoreDocument(
    doc,
    queryTerms,
    originalQuery,
    postingSizes
) {

    const title =
        String(
            doc.title || ""
        ).toLowerCase();

    const description =
        String(
            doc.description || ""
        ).toLowerCase();

    const url =
        String(
            doc.url || ""
        ).toLowerCase();

    const titleTokens =
        tokenizeText(title);

    const descriptionTokens =
        tokenizeText(description);

    const urlTokens =
        tokenizeText(url);

    let score = 0;
    let matchedTerms = 0;

    const normalizedQuery =
        String(
            originalQuery || ""
        )
            .trim()
            .toLowerCase();

    /*
     * Einzelne Suchbegriffe bewerten.
     */

    for (const term of queryTerms) {

        const titleExact =
            countTerm(
                titleTokens,
                term
            );

        const descriptionExact =
            countTerm(
                descriptionTokens,
                term
            );

        const urlExact =
            countTerm(
                urlTokens,
                term
            );

        const titleContains =
            title.includes(term);

        const descriptionContains =
            description.includes(term);

        const urlContains =
            url.includes(term);

        let termScore = 0;

        /*
         * TITEL
         */

        if (titleExact > 0) {

            termScore += 120;

            termScore +=
                Math.min(
                    titleExact,
                    3
                ) * 18;

        } else if (titleContains) {

            termScore += 55;

        }


        /*
         * BESCHREIBUNG
         */

        if (descriptionExact > 0) {

            termScore += 35;

            termScore +=
                Math.min(
                    descriptionExact,
                    3
                ) * 6;

        } else if (descriptionContains) {

            termScore += 14;

        }


        /*
         * URL
         */

        if (urlExact > 0) {

            termScore += 28;

        } else if (urlContains) {

            termScore += 8;

        }


        /*
         * SELTENHEIT
         *
         * Ein Begriff, der nur auf wenigen Seiten
         * vorkommt, ist informativer.
         */

        const postingSize =
            postingSizes.get(term) || 1;

        const totalDocuments =
            manifest?.documents || 1;

        const rarityBoost =
            Math.max(
                0.35,
                Math.min(
                    2.5,
                    Math.log10(
                        totalDocuments /
                        Math.max(
                            1,
                            postingSize
                        )
                    ) + 0.7
                )
            );

        termScore *= rarityBoost;


        if (termScore > 0) {
            matchedTerms++;
            score += termScore;
        }

    }


    /*
     * QUERY-COVERAGE
     *
     * Eine Seite, die 4/4 Begriffe enthält,
     * soll klar vor einer Seite mit 1/4 liegen.
     */

    const coverage =
        queryTerms.length
            ? matchedTerms /
              queryTerms.length
            : 0;

    score +=
        coverage * 180;


    /*
     * Bonus für vollständige Abdeckung.
     */

    if (
        queryTerms.length > 1 &&
        matchedTerms === queryTerms.length
    ) {

        score += 140;

    }


    /*
     * EXAKTE SUCHPHRASE
     */

    if (
        normalizedQuery.length >= 3 &&
        title.includes(normalizedQuery)
    ) {

        score += 260;

    }

    if (
        normalizedQuery.length >= 3 &&
        description.includes(normalizedQuery)
    ) {

        score += 70;

    }


    /*
     * Kurze, nichtssagende Titel etwas abwerten.
     */

    if (
        title.length > 0 &&
        title.length < 4
    ) {

        score *= 0.9;

    }


    return {
        score,
        matchedTerms
    };

}


/* ============================================================
   SUCHERGEBNISSE FINDEN
   ============================================================ */

async function searchTerms(
    terms,
    generation
) {

    if (
        generation !==
        searchGeneration
    ) {

        return {
            documents:[],
            postingSizes:new Map()
        };

    }


    const postingLists =
        await Promise.all(
            terms.map(
                term =>
                    loadTermShard(term)
            )
        );


    if (
        generation !==
        searchGeneration
    ) {

        return {
            documents:[],
            postingSizes:new Map()
        };

    }


    const postingSizes =
        new Map();


    for (
        let i = 0;
        i < terms.length;
        i++
    ) {

        postingSizes.set(
            terms[i],
            postingLists[i]?.length || 0
        );

    }


    /*
     * OR-Suche:
     *
     * Eine Seite darf schon dann Kandidat sein,
     * wenn sie mindestens einen Suchbegriff enthält.
     *
     * Das Ranking entscheidet danach,
     * wie relevant die Seite wirklich ist.
     */

    const candidateSet =
        new Set();


    /*
     * Seltene Begriffe werden vollständig betrachtet.
     * Sehr häufige Begriffe werden begrenzt.
     */

    for (const list of postingLists) {

        if (
            !list ||
            list.length === 0
        ) {
            continue;
        }

        const limit =
            Math.min(
                list.length,
                MAX_POSTINGS_PER_TERM
            );


        for (
            let i = 0;
            i < limit;
            i++
        ) {

            candidateSet.add(
                list[i]
            );

        }

    }


    if (
        candidateSet.size === 0
    ) {

        return {
            documents:[],
            postingSizes
        };

    }


    const documents =
        await loadDocuments(
            [...candidateSet]
        );


    return {
        documents,
        postingSizes
    };

}


/* ============================================================
   EIN-ZEICHEN-SUCHE
   ============================================================ */

async function searchSingleCharacter(
    term,
    generation
) {

    const result = [];

    const shards =
        Array.from(
            {length:256},
            (_,i) =>
                i
                    .toString(16)
                    .padStart(2,"0")
        );


    const shardResults =
        await Promise.all(
            shards.map(
                async shard => {

                    if (
                        generation !==
                        searchGeneration
                    ) {
                        return [];
                    }

                    const data =
                        await loadDocumentShard(
                            shard
                        );

                    return Object.values(
                        data || {}
                    );

                }
            )
        );


    if (
        generation !==
        searchGeneration
    ) {
        return [];
    }


    const needle =
        normalizeWord(term);


    for (
        const documents of shardResults
    ) {

        for (
            const doc of documents
        ) {

            const text =
                (
                    (doc.title || "") +
                    " " +
                    (doc.description || "") +
                    " " +
                    (doc.url || "")
                )
                    .toLowerCase();


            if (
                text.includes(needle)
            ) {

                result.push(doc);

                if (
                    result.length >=
                    MAX_RESULTS
                ) {

                    return result;

                }

            }

        }

    }


    return result;

}


/* ============================================================
   SNIPPET
   ============================================================ */

function createSnippet(
    doc,
    terms
) {

    const description =
        String(
            doc.description || ""
        ).trim();

    const title =
        String(
            doc.title || ""
        ).trim();

    const url =
        String(
            doc.url || ""
        ).trim();


    /*
     * Zuerst Beschreibung verwenden.
     */

    if (description) {

        let bestPosition = -1;

        const lower =
            description.toLowerCase();


        for (const term of terms) {

            const position =
                lower.indexOf(
                    term.toLowerCase()
                );

            if (
                position >= 0 &&
                (
                    bestPosition < 0 ||
                    position < bestPosition
                )
            ) {

                bestPosition = position;

            }

        }


        if (
            bestPosition >= 0 &&
            description.length > 180
        ) {

            const start =
                Math.max(
                    0,
                    bestPosition - 70
                );

            const end =
                Math.min(
                    description.length,
                    start + 180
                );

            let snippet =
                description.substring(
                    start,
                    end
                );

            if (start > 0) {
                snippet = "…" + snippet;
            }

            if (end < description.length) {
                snippet += "…";
            }

            return snippet;

        }


        return description.substring(
            0,
            220
        ) +
        (
            description.length > 220
                ? "…"
                : ""
        );

    }


    /*
     * Falls keine Beschreibung vorhanden ist,
     * Titel bzw. URL anzeigen.
     */

    if (title) {
        return title;
    }

    return url;

}


/* ============================================================
   WEB-ERGEBNISSE RENDERN
   ============================================================ */

function renderWebResults(
    documents,
    terms
) {

    const element =
        document.getElementById(
            "webResults"
        );


    if (
        !documents ||
        documents.length === 0
    ) {

        element.innerHTML =
            '<div class="empty">' +
            'Keine Ergebnisse gefunden.' +
            '</div>';

        return;

    }


    const fragment =
        document.createDocumentFragment();


    for (const doc of documents) {

        const article =
            document.createElement(
                "article"
            );

        article.className =
            "result";


        const title =
            doc.title ||
            doc.url ||
            "Unbenannte Seite";


        const url =
            doc.url ||
            "#";


        const snippet =
            createSnippet(
                doc,
                terms
            );


        article.innerHTML = `

            <a
                class="result-title"
                href="${escapeHTML(url)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ${escapeHTML(title)}
            </a>

            <div class="result-url">
                ${escapeHTML(url)}
            </div>

            ${
                snippet
                    ? `
                        <div class="result-description">
                            ${highlightText(
                                snippet,
                                terms
                            )}
                        </div>
                    `
                    : ""
            }

        `;


        fragment.appendChild(
            article
        );

    }


    element.appendChild(
        fragment
    );

}


/* ============================================================
   BILDER AUS WEBSEITE LESEN
   ============================================================ */

async function extractImagesFromPage(
    pageUrl
) {

    if (
        pageImageCache.has(pageUrl)
    ) {

        return pageImageCache.get(
            pageUrl
        );

    }


    let response;


    try {

        response =
            await fetch(
                pageUrl,
                {
                    method:"GET",
                    redirect:"follow",
                    credentials:"omit"
                }
            );

    } catch {

        pageImageCache.set(
            pageUrl,
            []
        );

        return [];

    }


    if (!response.ok) {

        pageImageCache.set(
            pageUrl,
            []
        );

        return [];

    }


    const contentType =
        response.headers.get(
            "content-type"
        ) || "";


    if (
        !contentType.includes(
            "text/html"
        )
    ) {

        pageImageCache.set(
            pageUrl,
            []
        );

        return [];

    }


    let html;


    try {

        html =
            await response.text();

    } catch {

        pageImageCache.set(
            pageUrl,
            []
        );

        return [];

    }


    const parser =
        new DOMParser();


    const pageDocument =
        parser.parseFromString(
            html,
            "text/html"
        );


    const imageElements =
        [
            ...pageDocument.querySelectorAll(
                "img"
            )
        ];


    const images = [];


    for (
        const img of imageElements
    ) {

        if (
            images.length >=
            MAX_IMAGES_PER_PAGE
        ) {
            break;
        }


        let src =
            img.getAttribute(
                "src"
            );


        if (!src) {

            src =
                img.getAttribute(
                    "data-src"
                );

        }


        if (!src) {

            src =
                img.getAttribute(
                    "data-lazy-src"
                );

        }


        if (!src) {
            continue;
        }


        try {

            src =
                new URL(
                    src,
                    pageUrl
                ).href;

        } catch {

            continue;

        }


        if (
            src.startsWith(
                "data:"
            )
        ) {
            continue;
        }


        const alt =
            img.getAttribute(
                "alt"
            ) || "";


        const title =
            img.getAttribute(
                "title"
            ) || "";


        images.push({
            src,
            alt,
            title,
            pageUrl
        });

    }


    const unique = [];
    const seen = new Set();


    for (
        const image of images
    ) {

        if (
            seen.has(image.src)
        ) {
            continue;
        }


        seen.add(
            image.src
        );

        unique.push(
            image
        );

    }


    pageImageCache.set(
        pageUrl,
        unique
    );


    return unique;

}


/* ============================================================
   BILDER RENDERN
   ============================================================ */

function renderImageResults(
    images
) {

    const container =
        document.getElementById(
            "imageResults"
        );


    container.innerHTML = "";


    if (
        !images ||
        images.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'Keine Bilder gefunden.' +
            '</div>';

        return;

    }


    const fragment =
        document.createDocumentFragment();


    for (
        const image of images
    ) {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "image-card";


        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "image-wrapper";


        const img =
            document.createElement(
                "img"
            );


        img.loading = "lazy";
        img.decoding = "async";


        img.src =
            image.src;


        img.alt =
            image.alt ||
            "Bild";


        img.addEventListener(
            "error",
            () => {

                card.remove();

            },
            {
                once:true
            }
        );


        wrapper.appendChild(
            img
        );


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "image-info";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "image-title";


        title.textContent =
            image.alt ||
            image.title ||
            "Bild";


        const source =
            document.createElement(
                "div"
            );

        source.className =
            "image-source";


        source.textContent =
            getHostname(
                image.pageUrl
            );


        info.appendChild(title);
        info.appendChild(source);

        card.appendChild(wrapper);
        card.appendChild(info);


        card.addEventListener(
            "click",
            () => {

                openImageViewer(
                    image
                );

            }
        );


        fragment.appendChild(
            card
        );

    }


    container.appendChild(
        fragment
    );

}


/* ============================================================
   HOSTNAME
   ============================================================ */

function getHostname(url) {

    try {

        return new URL(
            url
        ).hostname;

    } catch {

        return url;

    }

}


/* ============================================================
   BILDER-SUCHE
   ============================================================ */

async function searchImages(
    documents,
    generation
) {

    const status =
        document.getElementById(
            "status"
        );


    const images = [];


    const pages =
        documents.slice(
            0,
            MAX_IMAGE_SOURCE_PAGES
        );


    if (
        pages.length === 0
    ) {

        renderImageResults([]);

        return;

    }


    const pageResults =
        await Promise.all(
            pages.map(
                async page => {

                    if (
                        generation !==
                        searchGeneration
                    ) {
                        return [];
                    }

                    return extractImagesFromPage(
                        page.url
                    );

                }
            )
        );


    if (
        generation !==
        searchGeneration
    ) {
        return;
    }


    for (
        const pageImages of pageResults
    ) {

        for (
            const image of pageImages
        ) {

            if (
                images.some(
                    existing =>
                        existing.src ===
                        image.src
                )
            ) {
                continue;
            }


            images.push(
                image
            );


            if (
                images.length >=
                MAX_TOTAL_IMAGES
            ) {
                break;
            }

        }


        if (
            images.length >=
            MAX_TOTAL_IMAGES
        ) {
            break;
        }

    }


    renderImageResults(
        images
    );


    status.textContent =
        images.length +
        " Bilder aus " +
        pages.length +
        " Suchergebnissen";

}


/* ============================================================
   HAUPTSUCHE
   ============================================================ */

async function performSearch(
    query
) {

    const generation =
        ++searchGeneration;


    const status =
        document.getElementById(
            "status"
        );


    const diagnostics =
        document.getElementById(
            "diagnostics"
        );


    const webResults =
        document.getElementById(
            "webResults"
        );


    const imageResults =
        document.getElementById(
            "imageResults"
        );


    const startTime =
        performance.now();


    webResults.innerHTML = "";
    imageResults.innerHTML = "";


    if (
        !query.trim()
    ) {

        status.textContent = "";

        diagnostics.style.display =
            "none";

        return;

    }


    /*
     * Suchbegriffe normalisieren.
     *
     * Einfache Stoppwörter werden NICHT
     * automatisch entfernt, damit die Suche
     * nicht unerwartet verändert wird.
     */

    const terms =
        query
            .trim()
            .toLowerCase()
            .split(/\s+/)
            .map(normalizeWord)
            .filter(Boolean);


    status.innerHTML =
        '<span class="loading">' +
        '<span class="spinner"></span>' +
        'Suche...' +
        '</span>';


    try {

        let documents;
        let postingSizes =
            new Map();


        if (
            terms.length === 1 &&
            terms[0].length === 1
        ) {

            documents =
                await searchSingleCharacter(
                    terms[0],
                    generation
                );

        } else {

            const searchResult =
                await searchTerms(
                    terms,
                    generation
                );


            documents =
                searchResult.documents;


            postingSizes =
                searchResult.postingSizes;

        }


        if (
            generation !==
            searchGeneration
        ) {
            return;
        }


        /*
         * RELEVANZ-RANKING
         */

        documents =
            documents
                .map(doc => {

                    const ranking =
                        scoreDocument(
                            doc,
                            terms,
                            query,
                            postingSizes
                        );


                    return {
                        doc,
                        score:
                            ranking.score,
                        matchedTerms:
                            ranking.matchedTerms
                    };

                })
                .sort((a,b) => {

                    /*
                     * Primär nach Relevanz.
                     */

                    if (
                        b.score !==
                        a.score
                    ) {

                        return (
                            b.score -
                            a.score
                        );

                    }


                    /*
                     * Dann nach Anzahl
                     * erfüllter Begriffe.
                     */

                    if (
                        b.matchedTerms !==
                        a.matchedTerms
                    ) {

                        return (
                            b.matchedTerms -
                            a.matchedTerms
                        );

                    }


                    /*
                     * Stabiler Tie-Breaker.
                     */

                    return String(
                        a.doc.title || ""
                    ).localeCompare(
                        String(
                            b.doc.title || ""
                        ),
                        "de"
                    );

                })
                .filter(
                    item =>
                        item.score > 0
                )
                .slice(
                    0,
                    MAX_RESULTS
                )
                .map(
                    item =>
                        item.doc
                );


        /*
         * WEB-ERGEBNISSE
         */

        renderWebResults(
            documents,
            terms
        );


        const elapsed =
            Math.round(
                performance.now() -
                startTime
            );


        status.textContent =
            documents.length +
            " Treffer · " +
            elapsed +
            " ms";


        diagnostics.textContent =
            "RAM Term-Cache: " +
            termCache.size +
            " · RAM Dokument-Shards: " +
            documentShardCache.size +
            " · Seiten-Bildcache: " +
            pageImageCache.size +
            " · Index-Dokumente: " +
            (
                manifest?.documents ??
                "?"
            );


        diagnostics.style.display =
            "block";


        /*
         * BILDER
         */

        if (
            currentTab ===
            "images"
        ) {

            await searchImages(
                documents,
                generation
            );

        }

    } catch(error) {

        console.error(error);

        status.textContent =
            "Fehler bei der Suche.";


        webResults.innerHTML =
            '<div class="empty">' +
            escapeHTML(
                error.message
            ) +
            '</div>';

    }

}


/* ============================================================
   TABS
   ============================================================ */

let currentTab =
    "web";


const webTab =
    document.getElementById(
        "webTab"
    );


const imagesTab =
    document.getElementById(
        "imagesTab"
    );


const webResults =
    document.getElementById(
        "webResults"
    );


const imageResults =
    document.getElementById(
        "imageResults"
    );


function switchTab(tab) {

    currentTab =
        tab;


    if (
        tab === "web"
    ) {

        webTab.classList.add(
            "active"
        );

        imagesTab.classList.remove(
            "active"
        );

        webResults.style.display =
            "block";

        imageResults.style.display =
            "none";

        return;

    }


    imagesTab.classList.add(
        "active"
    );

    webTab.classList.remove(
        "active"
    );

    webResults.style.display =
        "none";

    imageResults.style.display =
        "grid";


    const query =
        searchInput.value.trim();


    if (query) {

        performSearch(
            query
        );

    }

}


webTab.addEventListener(
    "click",
    () => {
        switchTab("web");
    }
);


imagesTab.addEventListener(
    "click",
    () => {
        switchTab("images");
    }
);

   SUCHFELD
   ============================================================ */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


searchButton.addEventListener(
    "click",
    () => {

        performSearch(

        );

    }
);


searchInput.addEventListener(

        ) {

            );

    }
);


/* ============================================================
   IMAGE VIEWER
   ============================================================ */

const imageViewer =
    document.getElementById(
        "imageViewer"
    );


const viewerImage =
    document.getElementById(
        "viewerImage"
    );


const viewerCaption =
    document.getElementById(
        "viewerCaption"
    );


const viewerSource =
    document.getElementById(
        "viewerSource"
    );


function openImageViewer(image) {

    viewerImage.src =
        image.src;

    viewerImage.alt =
        image.alt ||
        "Bild";


    viewerCaption.textContent =
        image.alt ||
        image.title ||
        "";


    viewerSource.textContent =
        image.pageUrl;


    imageViewer.classList.add(
        "visible"
    );

}


function closeImageViewer() {

    imageViewer.classList.remove(
        "visible"
    );

    viewerImage.src = "";

}


document.getElementById(
    "viewerClose"
).addEventListener(
    "click",
    closeImageViewer
);


imageViewer.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            imageViewer
        ) {

            closeImageViewer();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeImageViewer();

        }

    }
);

/* ============================================================
   URL
   ============================================================ */

function getQueryFromURL() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("q") ||
        ""
    );

}

   START
   ============================================================ */

async function initialize() {

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.innerHTML =
            '<span class="loading">' +
            '<span class="spinner"></span>' +
            'Index wird geladen...' +
            '</span>';


        await loadManifest();


        status.textContent =
            "Bereit · " +
            (
                manifest?.documents ??
                "?"
            ) +
            " Dokumente";


        const query =
            getQueryFromURL();


        if (query) {

            searchInput.value =
                query;

            await performSearch(
                query
            );

        }

    } catch(error) {

        console.error(error);

        status.textContent =
            "Index konnte nicht geladen werden.";


        document.getElementById(
            "webResults"
        ).innerHTML =
            '<div class="empty">' +
            escapeHTML(
                error.message
            ) +
            '</div>';

    }

}


initialize();
