<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TBS Search</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #ffffff;
    color: #202124;
}


/* ============================================================
   HEADER
   ============================================================ */

header {
    padding: 70px 20px 30px;
    text-align: center;
}

.logo {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 28px;
}

.search-container {
    width: 100%;
    max-width: 720px;
    margin: auto;
}

.search-box {
    display: flex;
    width: 100%;
}

#searchInput {
    flex: 1;
    min-width: 0;

    height: 52px;

    padding: 0 18px;

    border: 1px solid #c7c7c7;
    border-right: none;

    border-radius: 26px 0 0 26px;

    font-size: 17px;

    outline: none;
}

#searchInput:focus {
    border-color: #4285f4;
}

#searchButton {
    height: 52px;

    padding: 0 25px;

    border: none;

    border-radius: 0 26px 26px 0;

    background: #4285f4;
    color: #ffffff;

    font-size: 16px;

    cursor: pointer;
}

#searchButton:hover {
    background: #3367d6;
}

#searchButton:disabled {
    opacity: 0.6;
    cursor: default;
}


/* ============================================================
   STATUS
   ============================================================ */

#status {
    max-width: 900px;

    margin: 20px auto 10px;

    padding: 0 20px;

    color: #70757a;

    font-size: 14px;
}


/* ============================================================
   DIAGNOSE
   ============================================================ */

#diagnostics {
    display: none;

    max-width: 900px;

    margin: 10px auto;

    padding: 12px 20px;

    font-family: monospace;

    font-size: 12px;

    background: #f6f8fa;

    border: 1px solid #ddd;

    border-radius: 8px;

    white-space: pre-wrap;

    word-break: break-word;
}


/* ============================================================
   RESULTS
   ============================================================ */

#results {
    max-width: 900px;

    margin: 0 auto;

    padding: 10px 20px 50px;
}

.result {
    margin-bottom: 27px;
}

.result-title {
    margin: 0;

    font-size: 20px;

    font-weight: 500;
}

.result-title a {
    color: #1a0dab;

    text-decoration: none;
}

.result-title a:hover {
    text-decoration: underline;
}

.result-url {
    margin: 4px 0;

    color: #188038;

    font-size: 14px;

    word-break: break-all;
}

.result-description {
    color: #4d5156;

    line-height: 1.5;

    font-size: 15px;

    max-width: 750px;
}

.empty {
    padding: 50px 20px;

    text-align: center;

    color: #777;
}


/* ============================================================
   SPINNER
   ============================================================ */

.spinner {
    display: inline-block;

    width: 18px;
    height: 18px;

    margin-right: 8px;

    border: 2px solid #ddd;

    border-top-color: #4285f4;

    border-radius: 50%;

    vertical-align: -4px;

    animation:
        spin 0.8s linear infinite;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 600px) {

    header {
        padding-top: 35px;
    }

    .logo {
        font-size: 38px;
    }

    #searchInput {
        font-size: 16px;
    }

    #searchButton {
        padding: 0 18px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        TBS Search
    </div>


    <div class="search-container">

        <form
            id="searchForm"
            class="search-box"
        >

            <input
                id="searchInput"
                type="search"
                placeholder="Das Web durchsuchen..."
                autocomplete="off"
                spellcheck="false"
            >


            <button
                id="searchButton"
                type="submit"
            >
                Suchen
            </button>

        </form>

    </div>

</header>


<div id="status">
    Suchindex wird geladen...
</div>


<div id="diagnostics"></div>


<main id="results"></main>


<script>

"use strict";


/* ============================================================
   KONFIGURATION
   ============================================================ */

const INDEX_ROOT =
    "data/index";

const TERMS_ROOT =
    INDEX_ROOT + "/terms";

const DOCS_ROOT =
    INDEX_ROOT + "/docs";

const MANIFEST_FILE =
    INDEX_ROOT + "/manifest.json";


const MAX_RESULTS = 100;


/*
 * Bei normalen Suchbegriffen werden höchstens diese
 * Dokumente aus den Posting-Listen geladen.
 */

const MAX_DOCUMENTS =
    500;


/*
 * Einbuchstabige Suchbegriffe können nicht im
 * normalen Term-Index existieren, weil build_index.py
 * Wörter < 2 Zeichen entfernt.
 *
 * Deshalb durchsuchen wir dafür die Dokument-Shards.
 */

const ALL_DOCUMENT_SHARDS = 256;


/* ============================================================
   RELOAD-ID
   ============================================================ */

const RELOAD_ID =
    Date.now().toString(36) +
    "-" +
    Math.random()
        .toString(36)
        .slice(2);


/* ============================================================
   CACHE
   ============================================================ */

const termShardCache =
    new Map();

const documentShardCache =
    new Map();

const documentCache =
    new Map();


let manifest = null;

let indexLoaded = false;


/* ============================================================
   DIAGNOSE
   ============================================================ */

const diagnosticLines = [];


function diagnostic(message) {

    diagnosticLines.push(
        message
    );


    console.log(
        "[TBS]",
        message
    );

}


function showDiagnostics() {

    const box =
        document.getElementById(
            "diagnostics"
        );


    box.textContent =
        diagnosticLines.join(
            "\n"
        );

}


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   NORMALISIERUNG
   ============================================================ */


/*
 * Muss zu normalize_word() aus build_index.py passen.
 *
 * Python:
 *
 *     word.lower().strip()
 */

function normalizeText(value) {

    return String(value ?? "")
        .toLowerCase()
        .trim();

}


/* ============================================================
   TOKENIZER
   ============================================================ */

function tokenize(query) {

    return normalizeText(query)

        .split(/\s+/)

        .map(
            word =>
                word.trim()
        )

        .filter(
            Boolean
        )

        .slice(
            0,
            10
        );

}


/* ============================================================
   FRISCHE URL
   ============================================================ */

function freshURL(path) {

    return (
        path +
        "?t=" +
        encodeURIComponent(
            RELOAD_ID
        ) +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* ============================================================
   FETCH
   ============================================================ */

async function freshFetch(
    path
) {

    const url =
        freshURL(path);


    diagnostic(
        "FETCH " +
        url
    );


    const response =
        await fetch(
            url,
            {
                method: "GET",

                cache: "no-store",

                headers: {
                    "Cache-Control":
                        "no-cache, no-store, max-age=0",

                    "Pragma":
                        "no-cache"
                }
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            path +
            " → HTTP " +
            response.status
        );

    }


    return response;

}


/* ============================================================
   SHA-256
   ============================================================ */

async function sha256(
    text
) {

    const bytes =
        new TextEncoder()
            .encode(text);


    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            bytes
        );


    return Array
        .from(
            new Uint8Array(
                hash
            )
        )

        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(
                        2,
                        "0"
                    )
        )

        .join("");

}


/* ============================================================
   MANIFEST
   ============================================================ */

async function loadIndex() {

    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML = `
        <span class="spinner"></span>
        Suchindex wird geladen...
    `;


    const response =
        await freshFetch(
            MANIFEST_FILE
        );


    manifest =
        await response.json();


    if (
        !manifest ||
        typeof manifest !== "object"
    ) {

        throw new Error(
            "manifest.json ist ungültig."
        );

    }


    indexLoaded =
        true;


    diagnostic(
        "✓ Manifest geladen"
    );


    diagnostic(
        "✓ Dokumente: " +
        manifest.documents
    );


    diagnostic(
        "✓ Term-Shards: " +
        manifest.term_shards
    );


    diagnostic(
        "✓ Dokument-Shards: " +
        manifest.document_shards
    );


    status.textContent =
        manifest.documents +
        " Seiten im Suchindex. Bereit.";

}


/* ============================================================
   TERM-SHARD LADEN
   ============================================================ */

async function getTermShard(
    term
) {

    const word =
        normalizeText(term);


    const hash =
        await sha256(
            word
        );


    const shard =
        hash.substring(
            0,
            2
        );


    if (
        termShardCache.has(
            shard
        )
    ) {

        return (
            termShardCache.get(
                shard
            )
        );

    }


    const path =
        TERMS_ROOT +
        "/" +
        shard +
        ".json";


    try {

        const response =
            await freshFetch(
                path
            );


        const data =
            await response.json();


        termShardCache.set(
            shard,
            data
        );


        diagnostic(
            "✓ Term-Shard " +
            shard +
            ".json geladen"
        );


        return data;

    }

    catch (error) {

        diagnostic(
            "✗ Term-Shard " +
            shard +
            ": " +
            error.message
        );


        /*
         * 404 bedeutet:
         * Das Wort-Shard existiert nicht.
         */

        if (
            String(
                error.message
            ).includes(
                "HTTP 404"
            )
        ) {

            const empty = {};

            termShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw error;

    }

}


/* ============================================================
   POSTINGS
   ============================================================ */

async function getPostings(
    term
) {

    const word =
        normalizeText(
            term
        );


    const shard =
        await getTermShard(
            word
        );


    const postings =
        shard[word];


    if (
        !Array.isArray(
            postings
        )
    ) {

        diagnostic(
            "⚠ Wort \"" +
            word +
            "\" nicht im Term-Index"
        );


        return [];

    }


    diagnostic(
        "✓ \"" +
        word +
        "\" → " +
        postings.length +
        " Dokumente"
    );


    return postings;

}


/* ============================================================
   DOKUMENT-SHARD NAME
   ============================================================ */


/*
 * build_index.py:
 *
 * document_shard(doc_id)
 *
 * return f"{doc_id % 256:02x}"
 */

function documentShardName(
    docId
) {

    const number =
        Number(docId);


    if (
        !Number.isSafeInteger(
            number
        )
    ) {

        throw new Error(
            "Ungültige Dokument-ID: " +
            docId
        );

    }


    return (
        number % 256
    )
        .toString(16)
        .padStart(
            2,
            "0"
        );

}


/* ============================================================
   DOKUMENT-SHARD LADEN
   ============================================================ */

async function getDocumentShard(
    shard
) {

    if (
        documentShardCache.has(
            shard
        )
    ) {

        return (
            documentShardCache.get(
                shard
            )
        );

    }


    const path =
        DOCS_ROOT +
        "/" +
        shard +
        ".json";


    try {

        const response =
            await freshFetch(
                path
            );


        const data =
            await response.json();


        documentShardCache.set(
            shard,
            data
        );


        diagnostic(
            "✓ Dokument-Shard " +
            shard +
            ".json geladen"
        );


        return data;

    }

    catch (error) {

        diagnostic(
            "✗ Dokument-Shard " +
            shard +
            ": " +
            error.message
        );


        if (
            String(
                error.message
            ).includes(
                "HTTP 404"
            )
        ) {

            const empty = {};

            documentShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw error;

    }

}


/* ============================================================
   DOKUMENTE ÜBER IDS LADEN
   ============================================================ */

async function loadDocuments(
    ids
) {

    const limited =
        ids.slice(
            0,
            MAX_DOCUMENTS
        );


    const result = [];


    /*
     * IDs nach Shard gruppieren.
     */

    const groups =
        new Map();


    for (
        const id
        of limited
    ) {

        const key =
            String(id);


        if (
            documentCache.has(
                key
            )
        ) {

            result.push(
                documentCache.get(
                    key
                )
            );

            continue;

        }


        const shard =
            documentShardName(
                id
            );


        if (
            !groups.has(
                shard
            )
        ) {

            groups.set(
                shard,
                []
            );

        }


        groups
            .get(shard)
            .push(key);

    }


    /*
     * Shards laden.
     */

    for (
        const [
            shard,
            shardIds
        ]
        of groups
    ) {

        const documents =
            await getDocumentShard(
                shard
            );


        for (
            const id
            of shardIds
        ) {

            const page =
                documents[id];


            if (!page) {

                diagnostic(
                    "⚠ Dokument " +
                    id +
                    " fehlt in Shard " +
                    shard
                );

                continue;

            }


            documentCache.set(
                id,
                page
            );


            result.push(
                page
            );

        }

    }


    return result;

}


/* ============================================================
   FALLBACK FÜR EINBUCHSTABIGE SUCHBEGRIFFE
   ============================================================ */


/*
 * build_index.py ignoriert Wörter < 2 Zeichen.
 *
 * Deshalb kann "e" nicht aus terms/*.json kommen.
 *
 * Wir durchsuchen in diesem Fall die Dokument-Shards.
 *
 * Die Dokument-Shards enthalten:
 *
 * url
 * title
 * description
 * updated
 *
 * Daher können wir auch ohne Änderung an Python
 * zumindest die indexierten Metadaten durchsuchen.
 */

async function fallbackSingleCharacter(
    term
) {

    const word =
        normalizeText(
            term
        );


    diagnostic(
        "→ Fallback für einbuchstabiges Wort: \"" +
        word +
        "\""
    );


    const results = [];


    /*
     * Alle 256 möglichen Shards.
     */

    for (
        let i = 0;
        i < ALL_DOCUMENT_SHARDS;
        i++
    ) {

        const shard =
            i
                .toString(16)
                .padStart(
                    2,
                    "0"
                );


        const documents =
            await getDocumentShard(
                shard
            );


        for (
            const id
            of Object.keys(
                documents
            )
        ) {

            const page =
                documents[id];


            const title =
                normalizeText(
                    page.title
                );


            const description =
                normalizeText(
                    page.description
                );


            const url =
                normalizeText(
                    page.url
                );


            if (
                title.includes(word) ||
                description.includes(word) ||
                url.includes(word)
            ) {

                results.push(
                    page
                );

            }

        }

    }


    diagnostic(
        "✓ Fallback gefunden: " +
        results.length
    );


    return results;

}


/* ============================================================
   SCORE
   ============================================================ */

function scorePage(
    page,
    terms
) {

    const title =
        normalizeText(
            page.title
        );


    const description =
        normalizeText(
            page.description
        );


    const url =
        normalizeText(
            page.url
        );


    let score = 0;


    for (
        const term
        of terms
    ) {

        if (
            title === term
        ) {

            score += 100;

        }


        if (
            title.includes(term)
        ) {

            score += 40;

        }


        if (
            description.includes(term)
        ) {

            score += 15;

        }


        if (
            url.includes(term)
        ) {

            score += 10;

        }

    }


    return score;

}


/* ============================================================
   SNIPPET
   ============================================================ */

function snippet(
    page
) {

    return String(
        page.description ||
        ""
    );

}


/* ============================================================
   NORMALE SUCHE
   ============================================================ */

async function normalSearch(
    terms
) {

    const postingLists = [];


    for (
        const term
        of terms
    ) {

        const postings =
            await getPostings(
                term
            );


        if (
            !postings.length
        ) {

            return [];

        }


        postingLists.push(
            postings
        );

    }


    /*
     * Kleinste Liste zuerst.
     */

    postingLists.sort(
        (a, b) =>
            a.length - b.length
    );


    /*
     * Schnittmenge.
     */

    let ids =
        new Set(
            postingLists[0]
        );


    for (
        let i = 1;
        i < postingLists.length;
        i++
    ) {

        const current =
            new Set(
                postingLists[i]
            );


        ids =
            new Set(
                [...ids]
                    .filter(
                        id =>
                            current.has(
                                id
                            )
                    )
            );


        if (
            !ids.size
        ) {

            return [];

        }

    }


    diagnostic(
        "✓ Gemeinsame Dokumente: " +
        ids.size
    );


    return loadDocuments(
        [...ids]
    );

}


/* ============================================================
   GESAMTE SUCHE
   ============================================================ */

async function search(
    query
) {

    const terms =
        tokenize(query);


    if (
        !terms.length
    ) {

        return [];

    }


    diagnostic(
        "────────────────────────"
    );


    diagnostic(
        "Suche: " +
        terms.join(
            ", "
        )
    );


    /*
     * Einbuchstabige Suchbegriffe:
     *
     * direkter Fallback.
     */

    if (
        terms.some(
            term =>
                term.length < 2
        )
    ) {

        return fallbackSingleCharacter(
            terms[0]
        );

    }


    /*
     * Normale Suche.
     */

    return normalSearch(
        terms
    );

}


/* ============================================================
   ERGEBNISSE
   ============================================================ */

function displayResults(
    pages,
    query
) {

    const container =
        document.getElementById(
            "results"
        );


    const status =
        document.getElementById(
            "status"
        );


    container.innerHTML = "";


    /*
     * Ranking.
     */

    const terms =
        tokenize(query);


    pages =
        pages
            .map(
                page => ({

                    page,

                    score:
                        scorePage(
                            page,
                            terms
                        )

                })
            )

            .sort(
                (a, b) =>
                    b.score -
                    a.score
            )

            .slice(
                0,
                MAX_RESULTS
            );


    status.textContent =
        pages.length +
        " Ergebnisse für „" +
        query +
        "“";


    if (
        !pages.length
    ) {

        container.innerHTML = `

            <div class="empty">

                Keine Ergebnisse für
                „${escapeHTML(query)}“
                gefunden.

            </div>

        `;

        showDiagnostics();

        return;

    }


    const fragment =
        document.createDocumentFragment();


    for (
        const item
        of pages
    ) {

        const page =
            item.page;


        const article =
            document.createElement(
                "article"
            );


        article.className =
            "result";


        const title =
            page.title ||
            page.url ||
            "Unbekannte Seite";


        const url =
            page.url ||
            "";


        const description =
            snippet(
                page
            );


        article.innerHTML = `

            <h2 class="result-title">

                <a
                    href="${escapeHTML(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${escapeHTML(title)}
                </a>

            </h2>


            <div class="result-url">

                ${escapeHTML(url)}

            </div>


            ${
                description
                    ? `
                        <div class="result-description">
                            ${escapeHTML(
                                description
                            )}
                        </div>
                      `
                    : ""
            }

        `;


        fragment.appendChild(
            article
        );

    }


    container.appendChild(
        fragment
    );


    showDiagnostics();

}


/* ============================================================
   SUCHE AUSFÜHREN
   ============================================================ */

async function performSearch(
    query
) {

    query =
        query.trim();


    const status =
        document.getElementById(
            "status"
        );


    const results =
        document.getElementById(
            "results"
        );


    const button =
        document.getElementById(
            "searchButton"
        );


    if (!query) {

        results.innerHTML = "";


        status.textContent =
            manifest.documents +
            " Seiten im Suchindex. Bereit.";


        return;

    }


    /*
     * Alte Diagnose löschen.
     */

    diagnosticLines.length = 0;


    button.disabled =
        true;


    status.innerHTML = `

        <span class="spinner"></span>

        Suche läuft...

    `;


    results.innerHTML = "";


    try {

        const pages =
            await search(
                query
            );


        displayResults(
            pages,
            query
        );

    }

    catch (error) {

        console.error(
            error
        );


        diagnostic(
            "✗ FATAL: " +
            error.message
        );


        status.textContent =
            "Fehler bei der Suche.";


        results.innerHTML = `

            <div class="empty">

                <strong>
                    Fehler beim Durchsuchen des Index
                </strong>

                <br><br>

                <code>
                    ${escapeHTML(
                        error.message
                    )}
                </code>

            </div>

        `;


        showDiagnostics();

    }


    button.disabled =
        false;

}


/* ============================================================
   FORMULAR
   ============================================================ */

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (
                !indexLoaded
            ) {

                return;

            }


            const input =
                document.getElementById(
                    "searchInput"
                );


            await performSearch(
                input.value
            );

        }
    );


/* ============================================================
   START
   ============================================================ */

async function start() {

    try {

        /*
         * Alles beim Start leeren.
         */

        document
            .getElementById(
                "searchInput"
            )
            .value = "";


        document
            .getElementById(
                "results"
            )
            .innerHTML = "";


        document
            .getElementById(
                "diagnostics"
            )
            .innerHTML = "";


        /*
         * Alten Suchparameter entfernen.
         */

        if (
            window.location.search
        ) {

            history.replaceState(
                null,
                "",
                window.location.pathname
            );

        }


        /*
         * FRISCHEN INDEX LADEN.
         */

        await loadIndex();


        diagnostic(
            "✓ Index bereit"
        );


        showDiagnostics();

    }

    catch (error) {

        console.error(
            error
        );


        const status =
            document.getElementById(
                "status"
            );


        status.textContent =
            "Index konnte nicht geladen werden.";


        diagnostic(
            "✗ Startfehler: " +
            error.message
        );


        showDiagnostics();

    }

}


start();

</script>
