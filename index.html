<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TBS Search</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #fff;
    color: #202124;
}


/* =========================
   HEADER
   ========================= */

header {
    padding: 70px 20px 30px;
    text-align: center;
}

.logo {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 28px;
}

.search-container {
    width: 100%;
    max-width: 720px;
    margin: auto;
}

.search-box {
    display: flex;
    width: 100%;
}

#searchInput {
    flex: 1;
    min-width: 0;

    height: 52px;

    padding: 0 18px;

    border: 1px solid #c7c7c7;
    border-right: none;

    border-radius: 26px 0 0 26px;

    font-size: 17px;

    outline: none;
}

#searchInput:focus {
    border-color: #4285f4;
}

#searchButton {
    height: 52px;

    padding: 0 25px;

    border: none;

    border-radius: 0 26px 26px 0;

    background: #4285f4;
    color: white;

    font-size: 16px;

    cursor: pointer;
}

#searchButton:hover {
    background: #3367d6;
}

#searchButton:disabled {
    opacity: 0.6;
    cursor: default;
}


/* =========================
   STATUS
   ========================= */

#status {
    max-width: 900px;

    margin: 20px auto 10px;

    padding: 0 20px;

    color: #70757a;

    font-size: 14px;
}


/* =========================
   RESULTS
   ========================= */

#results {
    max-width: 900px;

    margin: 0 auto;

    padding: 10px 20px 50px;
}

.result {
    margin-bottom: 27px;
}

.result-title {
    margin: 0;

    font-size: 20px;
    font-weight: 500;
}

.result-title a {
    color: #1a0dab;
    text-decoration: none;
}

.result-title a:hover {
    text-decoration: underline;
}

.result-url {
    margin: 4px 0;

    color: #188038;

    font-size: 14px;

    word-break: break-all;
}

.result-description {
    color: #4d5156;

    line-height: 1.5;

    font-size: 15px;

    max-width: 750px;
}

.empty {
    padding: 50px 20px;

    text-align: center;

    color: #777;
}


/* =========================
   LOADING
   ========================= */

.spinner {
    display: inline-block;

    width: 18px;
    height: 18px;

    margin-right: 8px;

    border: 2px solid #ddd;
    border-top-color: #4285f4;

    border-radius: 50%;

    vertical-align: -4px;

    animation: spin 0.8s linear infinite;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    header {
        padding-top: 35px;
    }

    .logo {
        font-size: 38px;
    }

    #searchInput {
        font-size: 16px;
    }

    #searchButton {
        padding: 0 18px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        TBS Search
    </div>

    <div class="search-container">

        <form
            id="searchForm"
            class="search-box"
        >

            <input
                id="searchInput"
                type="search"
                placeholder="Das Web durchsuchen..."
                autocomplete="off"
                spellcheck="false"
            >

            <button
                id="searchButton"
                type="submit"
            >
                Suchen
            </button>

        </form>

    </div>

</header>


<div id="status">
    Suchindex wird geladen...
</div>


<main id="results"></main>


<script>

"use strict";


/* ============================================================
   KONFIGURATION
   ============================================================ */


/*
 * EXAKT passend zu build_index.py
 */

const INDEX_ROOT = "data/index";

const TERMS_ROOT =
    INDEX_ROOT + "/terms";

const DOCS_ROOT =
    INDEX_ROOT + "/docs";

const MANIFEST_FILE =
    INDEX_ROOT + "/manifest.json";


const MAX_RESULTS = 100;


/*
 * Wichtig:
 *
 * Wir laden deutlich mehr IDs als Ergebnisse,
 * bevor das Ranking durchgeführt wird.
 */

const MAX_DOCUMENTS_TO_LOAD = 500;


/*
 * Maximale Anzahl Suchwörter.
 */

const MAX_TERMS = 10;


/* ============================================================
   RELOAD-ID
   ============================================================ */


/*
 * Wird bei JEDEM Seitenaufruf neu erzeugt.
 */

const RELOAD_ID =
    Date.now().toString() +
    "-" +
    Math.random()
        .toString(36)
        .substring(2);


/* ============================================================
   IN-MEMORY-CACHES
   ============================================================ */


/*
 * Diese Caches existieren nur solange diese
 * Seite geöffnet ist.
 *
 * Nach Reload = komplett leer.
 */

const termShardCache =
    new Map();

const documentShardCache =
    new Map();

const documentCache =
    new Map();


let manifest = null;

let indexLoaded = false;


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   NORMALISIERUNG
   ============================================================ */


/*
 * Muss zum normalize_word() des Python-Indexers
 * passen:
 *
 * Python:
 *
 *     word.lower().strip()
 *
 */

function normalizeText(value) {

    return String(value ?? "")
        .toLowerCase()
        .trim();

}


/* ============================================================
   SUCHBEGRIFFE
   ============================================================ */

function tokenize(query) {

    return normalizeText(query)

        .split(/\s+/)

        .map(
            term =>
                term
                    .trim()
        )

        .filter(Boolean)

        .slice(
            0,
            MAX_TERMS
        );

}


/* ============================================================
   FRISCHE URL
   ============================================================ */

function freshURL(path) {

    const separator =
        path.includes("?")
            ? "&"
            : "?";


    return (
        path +
        separator +
        "reload=" +
        encodeURIComponent(
            RELOAD_ID
        )
    );

}


/* ============================================================
   FETCH
   ============================================================ */

async function freshFetch(path) {

    const url =
        freshURL(path);


    console.log(
        "TBS Search →",
        url
    );


    const response =
        await fetch(
            url,
            {
                method: "GET",

                cache: "no-store",

                headers: {
                    "Cache-Control":
                        "no-cache"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            path +
            " → HTTP " +
            response.status
        );

    }


    return response;

}


/* ============================================================
   SHA-256
   ============================================================ */

async function sha256(text) {

    const data =
        new TextEncoder()
            .encode(text);


    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    const bytes =
        new Uint8Array(hash);


    return Array.from(bytes)

        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )

        .join("");

}


/* ============================================================
   MANIFEST
   ============================================================ */

async function loadIndex() {

    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML = `
        <span class="spinner"></span>
        Suchindex wird geladen...
    `;


    const response =
        await freshFetch(
            MANIFEST_FILE
        );


    manifest =
        await response.json();


    if (
        !manifest ||
        typeof manifest !== "object"
    ) {

        throw new Error(
            "manifest.json ist ungültig."
        );

    }


    indexLoaded = true;


    status.textContent =
        (
            manifest.documents ??
            "?"
        ) +
        " Seiten im Suchindex.";


    console.log(
        "TBS Search Manifest:",
        manifest
    );

}


/* ============================================================
   TERM-SHARD
   ============================================================ */


/*
 * build_index.py:
 *
 * shard =
 * sha256(word).hexdigest()[:2]
 *
 */

async function getTermShard(term) {

    const word =
        normalizeText(term);


    const hash =
        await sha256(word);


    const shard =
        hash.substring(
            0,
            2
        );


    if (
        termShardCache.has(
            shard
        )
    ) {

        return termShardCache.get(
            shard
        );

    }


    const path =
        TERMS_ROOT +
        "/" +
        shard +
        ".json";


    try {

        const response =
            await freshFetch(
                path
            );


        const data =
            await response.json();


        termShardCache.set(
            shard,
            data
        );


        return data;

    }

    catch (error) {

        /*
         * Ein fehlender Shard bedeutet:
         * Dieses Wort existiert nicht im Index.
         */

        if (
            String(
                error.message
            ).includes(
                "HTTP 404"
            )
        ) {

            const empty = {};

            termShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw error;

    }

}


/* ============================================================
   POSTING LIST
   ============================================================ */

async function getPostings(term) {

    const word =
        normalizeText(term);


    const shard =
        await getTermShard(
            word
        );


    const postings =
        shard[word];


    if (
        !Array.isArray(
            postings
        )
    ) {

        return [];

    }


    return postings;

}


/* ============================================================
   DOKUMENT-SHARD
   ============================================================ */


/*
 * EXAKT wie build_index.py:
 *
 *     f"{doc_id % 256:02x}"
 *
 */

function documentShardName(
    docId
) {

    const number =
        Number(docId);


    if (
        !Number.isSafeInteger(
            number
        )
    ) {

        throw new Error(
            "Ungültige Dokument-ID: " +
            docId
        );

    }


    return (
        number % 256
    )
        .toString(16)
        .padStart(
            2,
            "0"
        );

}


/* ============================================================
   DOKUMENT-SHARD LADEN
   ============================================================ */

async function getDocumentShard(
    shard
) {

    if (
        documentShardCache.has(
            shard
        )
    ) {

        return documentShardCache.get(
            shard
        );

    }


    const path =
        DOCS_ROOT +
        "/" +
        shard +
        ".json";


    try {

        const response =
            await freshFetch(
                path
            );


        const data =
            await response.json();


        documentShardCache.set(
            shard,
            data
        );


        return data;

    }

    catch (error) {

        if (
            String(
                error.message
            ).includes(
                "HTTP 404"
            )
        ) {

            const empty = {};

            documentShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw error;

    }

}


/* ============================================================
   DOKUMENTE LADEN
   ============================================================ */

async function loadDocuments(
    ids
) {

    /*
     * Begrenzen, damit eine Suche nach einem
     * sehr häufigen Wort nicht tausende
     * Dateien laden muss.
     */

    const limitedIds =
        ids.slice(
            0,
            MAX_DOCUMENTS_TO_LOAD
        );


    const result = [];


    /*
     * IDs nach Dokument-Shard gruppieren.
     */

    const groups =
        new Map();


    for (
        const id
        of limitedIds
    ) {

        const key =
            String(id);


        /*
         * Schon im Speicher?
         */

        if (
            documentCache.has(
                key
            )
        ) {

            result.push(
                documentCache.get(
                    key
                )
            );

            continue;

        }


        const shard =
            documentShardName(
                id
            );


        if (
            !groups.has(
                shard
            )
        ) {

            groups.set(
                shard,
                []
            );

        }


        groups
            .get(shard)
            .push(key);

    }


    /*
     * Benötigte Shards laden.
     */

    for (
        const [
            shard,
            shardIds
        ]
        of groups
    ) {

        const documents =
            await getDocumentShard(
                shard
            );


        for (
            const id
            of shardIds
        ) {

            /*
             * build_index.py schreibt die
             * Dokument-ID als String-Key.
             */

            const page =
                documents[id];


            if (!page) {

                console.warn(
                    "Dokument fehlt:",
                    id,
                    "Shard:",
                    shard
                );

                continue;

            }


            documentCache.set(
                id,
                page
            );


            result.push(
                page
            );

        }

    }


    return result;

}


/* ============================================================
   RANKING
   ============================================================ */

function calculateScore(
    page,
    terms
) {

    const title =
        normalizeText(
            page.title
        );


    const description =
        normalizeText(
            page.description
        );


    const url =
        normalizeText(
            page.url
        );


    let score = 0;


    for (
        const term
        of terms
    ) {

        if (
            title === term
        ) {

            score += 100;

        }

        else if (
            title.includes(term)
        ) {

            score += 40;

        }


        if (
            description.includes(term)
        ) {

            score += 15;

        }


        if (
            url.includes(term)
        ) {

            score += 10;

        }

    }


    return score;

}


/* ============================================================
   SNIPPET
   ============================================================ */

function createSnippet(
    page,
    terms
) {

    /*
     * Der aktuelle build_index.py speichert
     * absichtlich nur:
     *
     * url
     * title
     * description
     * updated
     *
     * Deshalb kann die Suche hier nicht
     * auf page.text zugreifen.
     */

    const description =
        String(
            page.description || ""
        );


    if (
        description
    ) {

        return description;

    }


    return "";

}


/* ============================================================
   SUCHERGEBNISSE
   ============================================================ */

function displayResults(
    results,
    query
) {

    const container =
        document.getElementById(
            "results"
        );


    const status =
        document.getElementById(
            "status"
        );


    container.innerHTML = "";


    if (
        !results.length
    ) {

        status.textContent =
            "0 Ergebnisse für „" +
            query +
            "“";


        container.innerHTML = `

            <div class="empty">

                Keine Ergebnisse für
                „${escapeHTML(query)}“
                gefunden.

            </div>

        `;

        return;

    }


    status.textContent =
        results.length +
        " Ergebnisse für „" +
        query +
        "“";


    const fragment =
        document.createDocumentFragment();


    for (
        const result
        of results
    ) {

        const page =
            result.page;


        const article =
            document.createElement(
                "article"
            );


        article.className =
            "result";


        const title =
            page.title ||
            page.url ||
            "Unbekannte Seite";


        const url =
            page.url || "";


        const snippet =
            createSnippet(
                page,
                tokenize(query)
            );


        article.innerHTML = `

            <h2 class="result-title">

                <a
                    href="${escapeHTML(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${escapeHTML(title)}
                </a>

            </h2>

            <div class="result-url">
                ${escapeHTML(url)}
            </div>

            ${
                snippet
                    ? `
                        <div class="result-description">
                            ${escapeHTML(snippet)}
                        </div>
                      `
                    : ""
            }

        `;


        fragment.appendChild(
            article
        );

    }


    container.appendChild(
        fragment
    );

}


/* ============================================================
   SUCHE
   ============================================================ */

async function search(
    query
) {

    const terms =
        tokenize(query);


    if (
        !terms.length
    ) {

        return [];

    }


    console.log(
        "Suche nach:",
        terms
    );


    /*
     * Für jedes Suchwort Posting-Liste laden.
     */

    const postingLists = [];


    for (
        const term
        of terms
    ) {

        const postings =
            await getPostings(
                term
            );


        console.log(
            "Posting-Liste:",
            term,
            postings.length
        );


        if (
            !postings.length
        ) {

            return [];

        }


        postingLists.push(
            postings
        );

    }


    /*
     * Kleinste Liste zuerst.
     */

    postingLists.sort(
        (a, b) =>
            a.length - b.length
    );


    /*
     * Schnittmenge bilden.
     */

    let matchingIds =
        new Set(
            postingLists[0]
        );


    for (
        let i = 1;
        i < postingLists.length;
        i++
    ) {

        const current =
            new Set(
                postingLists[i]
            );


        matchingIds =
            new Set(
                [...matchingIds]
                    .filter(
                        id =>
                            current.has(id)
                    )
            );


        if (
            !matchingIds.size
        ) {

            return [];

        }

    }


    const ids =
        [...matchingIds];


    console.log(
        "Treffer im Index:",
        ids.length
    );


    /*
     * Dokumente laden.
     */

    const pages =
        await loadDocuments(
            ids
        );


    console.log(
        "Dokumente geladen:",
        pages.length
    );


    /*
     * Ranking.
     */

    const results =
        pages.map(
            page => ({

                page,

                score:
                    calculateScore(
                        page,
                        terms
                    )

            })
        );


    results.sort(
        (a, b) =>
            b.score - a.score
    );


    return results.slice(
        0,
        MAX_RESULTS
    );

}


/* ============================================================
   SUCHE AUSFÜHREN
   ============================================================ */

async function performSearch(
    query
) {

    const status =
        document.getElementById(
            "status"
        );


    const results =
        document.getElementById(
            "results"
        );


    const button =
        document.getElementById(
            "searchButton"
        );


    query =
        query.trim();


    if (!query) {

        results.innerHTML = "";


        status.textContent =
            (
                manifest?.documents ??
                "?"
            ) +
            " Seiten im Suchindex.";


        return;

    }


    button.disabled = true;


    status.innerHTML = `
        <span class="spinner"></span>
        Suche läuft...
    `;


    results.innerHTML = "";


    try {

        const found =
            await search(
                query
            );


        displayResults(
            found,
            query
        );

    }

    catch (error) {

        console.error(
            "TBS Search Fehler:",
            error
        );


        status.textContent =
            "Fehler bei der Suche.";


        results.innerHTML = `

            <div class="empty">

                <strong>
                    Fehler beim Durchsuchen des Index
                </strong>

                <br><br>

                <code>
                    ${escapeHTML(
                        error.message
                    )}
                </code>

            </div>

        `;

    }


    button.disabled = false;

}


/* ============================================================
   FORMULAR
   ============================================================ */

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (
                !indexLoaded
            ) {

                return;

            }


            const input =
                document.getElementById(
                    "searchInput"
                );


            await performSearch(
                input.value
            );

        }
    );


/* ============================================================
   START
   ============================================================ */

async function start() {

    try {

        /*
         * Suchfeld bei jedem Reload leeren.
         */

        document
            .getElementById(
                "searchInput"
            )
            .value = "";


        /*
         * Ergebnisse leeren.
         */

        document
            .getElementById(
                "results"
            )
            .innerHTML = "";


        /*
         * KEINE URL-Suche wiederherstellen.
         */

        await loadIndex();


        document
            .getElementById(
                "status"
            )
            .textContent =
                (
                    manifest?.documents ??
                    "?"
                ) +
                " Seiten im Suchindex. Bereit.";


        console.log(
            "TBS Search bereit.",
            "Reload:",
            RELOAD_ID
        );

    }

    catch (error) {

        console.error(
            "TBS Search Startfehler:",
            error
        );


        document
            .getElementById(
                "status"
            )
            .textContent =
                "Suchindex konnte nicht geladen werden.";


        document
            .getElementById(
                "results"
            )
            .innerHTML = `

                <div class="empty">

                    <strong>
                        Suchindex konnte nicht geladen werden.
                    </strong>

                    <br><br>

                    <code>
                        ${escapeHTML(
                            error.message
                        )}
                    </code>

                </div>

            `;

    }

}


start();

</script>

</body>
</html>
