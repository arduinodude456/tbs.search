<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TBS - Suche</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #ffffff;
            color: #202124;
        }


        /* =========================
           HEADER
           ========================= */

        header {
            padding: 70px 20px 30px;
            text-align: center;
        }


        .logo {
            font-size: 46px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 28px;
        }


        .search-container {
            width: 100%;
            max-width: 720px;
            margin: auto;
        }


        .search-box {
            display: flex;
            width: 100%;
        }


        #searchInput {
            flex: 1;
            min-width: 0;

            height: 52px;

            padding: 0 18px;

            border: 1px solid #c7c7c7;
            border-right: none;

            border-radius: 26px 0 0 26px;

            font-size: 17px;

            outline: none;
        }


        #searchInput:focus {
            border-color: #4285f4;
        }


        #searchButton {
            height: 52px;

            padding: 0 25px;

            border: none;

            border-radius: 0 26px 26px 0;

            background: #4285f4;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        #searchButton:hover {
            background: #3367d6;
        }


        #searchButton:disabled {
            opacity: 0.6;
            cursor: default;
        }


        /* =========================
           STATUS
           ========================= */

        #status {
            max-width: 900px;

            margin: 20px auto 10px;

            padding: 0 20px;

            color: #70757a;

            font-size: 14px;
        }


        /* =========================
           RESULTS
           ========================= */

        #results {
            max-width: 900px;

            margin: 0 auto;

            padding: 10px 20px 50px;
        }


        .result {
            margin-bottom: 27px;
        }


        .result-title {
            margin: 0;

            font-size: 20px;

            font-weight: 500;
        }


        .result-title a {
            color: #1a0dab;

            text-decoration: none;
        }


        .result-title a:hover {
            text-decoration: underline;
        }


        .result-url {
            margin: 4px 0;

            color: #188038;

            font-size: 14px;

            word-break: break-all;
        }


        .result-description {
            color: #4d5156;

            line-height: 1.5;

            font-size: 15px;

            max-width: 750px;
        }


        .empty {
            padding: 50px 20px;

            text-align: center;

            color: #777;
        }


        /* =========================
           LOADING
           ========================= */

        .loading {
            padding: 40px 20px;

            text-align: center;

            color: #70757a;
        }


        .spinner {
            display: inline-block;

            width: 18px;
            height: 18px;

            margin-right: 8px;

            border: 2px solid #ddd;
            border-top-color: #4285f4;

            border-radius: 50%;

            vertical-align: -4px;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            header {
                padding-top: 35px;
            }


            .logo {
                font-size: 38px;
            }


            .search-box {
                display: flex;
            }


            #searchInput {
                font-size: 16px;
            }


            #searchButton {
                padding: 0 18px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        TBS Search
    </div>


    <div class="search-container">

        <form
            id="searchForm"
            class="search-box"
        >

            <input
                id="searchInput"
                type="search"
                placeholder="Das Web durchsuchen..."
                autocomplete="off"
                spellcheck="false"
            >


            <button
                id="searchButton"
                type="submit"
            >
                Suchen
            </button>

        </form>

    </div>

</header>


<div id="status">
    Suchindex wird geladen...
</div>


<main id="results"></main>


<script>

"use strict";


/* ============================================================
   KONFIGURATION
   ============================================================ */


const INDEX_ROOT = "data/index";

const PAGES_ROOT = "data/pages";


const MANIFEST_FILE =
    INDEX_ROOT + "/manifest.json";


const MAX_RESULTS = 100;


/*
 * Maximal so viele Dokumente werden tatsächlich
 * aus den Page-Shards geladen.
 *
 * Dadurch kann eine sehr häufige Suchanfrage
 * nicht tausende Seiten gleichzeitig laden.
 */

const MAX_DOCUMENTS_TO_LOAD = 300;


/*
 * Begrenzung für Suchbegriffe.
 */

const MAX_TERMS = 10;



/* ============================================================
   GLOBALER INDEX
   ============================================================ */


let manifest = null;

let indexLoaded = false;



/*
 * Cache für bereits geladene Term-Shards.
 *
 * Beispiel:
 *
 * {
 *     "ab": {...},
 *     "7f": {...}
 * }
 */

const termShardCache = new Map();



/*
 * Cache für Dokument-Shards.
 */

const documentShardCache = new Map();



/*
 * Cache für einzelne Dokumente.
 */

const documentCache = new Map();



/* ============================================================
   HTML ESCAPING
   ============================================================ */


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* ============================================================
   TEXT NORMALISIEREN
   ============================================================ */


function normalizeText(value) {

    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}



/* ============================================================
   SUCHBEGRIFFE
   ============================================================ */


function tokenize(query) {

    return normalizeText(query)
        .split(/\s+/)
        .map(term =>
            term
                .replace(/[^\p{L}\p{N}_-]/gu, "")
                .trim()
        )
        .filter(Boolean)
        .slice(0, MAX_TERMS);

}



/* ============================================================
   HASH / SHARD
   ============================================================ */


/*
 * Der Index-Builder muss denselben Hash verwenden.
 *
 * SHA-256 ist im Browser über WebCrypto verfügbar.
 */


async function sha256(text) {

    const data =
        new TextEncoder().encode(text);


    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    const bytes =
        new Uint8Array(hash);


    return Array.from(bytes)
        .map(byte =>
            byte.toString(16).padStart(2, "0")
        )
        .join("");

}



/* ============================================================
   TERM-SHARD
   ============================================================ */


async function getTermShard(term) {

    const normalized =
        normalizeText(term);


    const hash =
        await sha256(normalized);


    /*
     * Der erste Hash-Bereich bestimmt
     * den Shard.
     */

    const shard =
        hash.substring(0, 2);


    if (termShardCache.has(shard)) {

        return termShardCache.get(shard);

    }


    const url =
        INDEX_ROOT +
        "/terms/" +
        shard +
        ".json";


    const response =
        await fetch(url);


    if (!response.ok) {

        /*
         * Ein nicht vorhandener Shard bedeutet
         * einfach: keine Treffer.
         */

        if (response.status === 404) {

            const empty = {};

            termShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw new Error(
            "Term-Shard HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    termShardCache.set(
        shard,
        data
    );


    return data;

}



/* ============================================================
   TERM-POSTINGS
   ============================================================ */


async function getPostings(term) {

    const shard =
        await getTermShard(term);


    /*
     * Erwartetes Format:

     {
         "suchbegriff": [
             "document-id",
             "document-id"
         ]
     }
     */


    const postings =
        shard[normalizeText(term)];


    if (!Array.isArray(postings)) {

        return [];

    }


    return postings;

}



/* ============================================================
   DOKUMENT-SHARD
   ============================================================ */


async function getDocumentShard(shard) {

    if (
        documentShardCache.has(shard)
    ) {

        return documentShardCache.get(
            shard
        );

    }


    const url =
        PAGES_ROOT +
        "/" +
        shard +
        ".json";


    const response =
        await fetch(url);


    if (!response.ok) {

        if (response.status === 404) {

            const empty = {};

            documentShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw new Error(
            "Dokument-Shard HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    documentShardCache.set(
        shard,
        data
    );


    return data;

}



/* ============================================================
   DOKUMENT LADEN
   ============================================================ */


async function loadDocuments(ids) {

    const result = [];


    /*
     * Wir laden nicht mehr als
     * MAX_DOCUMENTS_TO_LOAD Dokumente.
     */

    const limitedIds =
        ids.slice(
            0,
            MAX_DOCUMENTS_TO_LOAD
        );


    /*
     * Dokument-ID → Shard.
     *
     * Falls der Index-Builder die Dokument-ID
     * als SHA-256(URL) erzeugt, ist das
     * ebenfalls der erste Hash-Bereich.
     */


    const groups = new Map();


    for (const id of limitedIds) {

        if (
            documentCache.has(id)
        ) {

            result.push(
                documentCache.get(id)
            );

            continue;

        }


        const shard =
            String(id).substring(0, 2);


        if (!groups.has(shard)) {

            groups.set(
                shard,
                []
            );

        }


        groups
            .get(shard)
            .push(id);

    }


    /*
     * Benötigte Dokument-Shards laden.
     */

    for (
        const [shard, shardIds]
        of groups
    ) {

        const documents =
            await getDocumentShard(
                shard
            );


        for (const id of shardIds) {

            const page =
                documents[id];


            if (!page) {
                continue;
            }


            documentCache.set(
                id,
                page
            );


            result.push(page);

        }

    }


    return result;

}



/* ============================================================
   SCORE
   ============================================================ */


function countOccurrences(
    text,
    term
) {

    if (!term) {
        return 0;
    }


    let count = 0;

    let position = 0;


    while (true) {

        const found =
            text.indexOf(
                term,
                position
            );


        if (found === -1) {
            break;
        }


        count++;


        position =
            found + term.length;

    }


    return count;

}



function calculateScore(
    page,
    terms
) {

    const title =
        normalizeText(
            page.title
        );


    const description =
        normalizeText(
            page.description
        );


    const text =
        normalizeText(
            page.text
        );


    const url =
        normalizeText(
            page.url
        );


    const headings =
        normalizeText(
            Array.isArray(page.headings)
                ? page.headings.join(" ")
                : ""
        );


    let score = 0;


    for (const term of terms) {

        /*
         * Exakter Titel
         */

        if (
            title === term
        ) {

            score += 100;

        }


        /*
         * Titel enthält Begriff
         */

        else if (
            title.includes(term)
        ) {

            score += 40;

        }


        /*
         * Überschrift
         */

        if (
            headings.includes(term)
        ) {

            score += 20;

        }


        /*
         * URL
         */

        if (
            url.includes(term)
        ) {

            score += 10;

        }


        /*
         * Beschreibung
         */

        if (
            description.includes(term)
        ) {

            score += 12;

        }


        /*
         * Text
         */

        if (
            text.includes(term)
        ) {

            score += 3;


            const occurrences =
                countOccurrences(
                    text,
                    term
                );


            score += Math.min(
                occurrences * 0.25,
                10
            );

        }

    }


    /*
     * Alle Begriffe im Titel
     */

    const allInTitle =
        terms.every(
            term =>
                title.includes(term)
        );


    if (allInTitle) {

        score += 50;

    }


    /*
     * Alle Begriffe irgendwo
     */

    const allInPage =
        terms.every(
            term =>
                title.includes(term) ||
                headings.includes(term) ||
                description.includes(term) ||
                text.includes(term)
        );


    if (allInPage) {

        score += 30;

    }


    return score;

}



/* ============================================================
   SNIPPET
   ============================================================ */


function createSnippet(
    page,
    terms
) {

    const text =
        String(
            page.text || ""
        );


    if (!text) {

        return (
            page.description ||
            ""
        );

    }


    const normalized =
        normalizeText(text);


    let position = -1;


    for (const term of terms) {

        const p =
            normalized.indexOf(term);


        if (p !== -1) {

            position = p;

            break;

        }

    }


    /*
     * Kein Suchbegriff im Text
     */

    if (position === -1) {

        return text.substring(
            0,
            300
        ) + (
            text.length > 300
                ? "…"
                : ""
        );

    }


    const snippetLength =
        300;


    const start =
        Math.max(
            0,
            position - 100
        );


    const end =
        Math.min(
            text.length,
            start + snippetLength
        );


    let snippet =
        text.substring(
            start,
            end
        );


    if (start > 0) {

        snippet =
            "…" +
            snippet;

    }


    if (
        end < text.length
    ) {

        snippet += "…";

    }


    return snippet;

}



/* ============================================================
   INDEX LADEN
   ============================================================ */


async function loadIndex() {

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.textContent =
            "Suchindex wird geladen...";


        const response =
            await fetch(
                MANIFEST_FILE
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        manifest =
            await response.json();


        indexLoaded = true;


        /*
         * Manifest kann z.B. enthalten:

         {
             "pages": 2117,
             "terms": ...,
             "version": ...
         }
         */


        const pageCount =
            manifest.pages ??
            manifest.documents ??
            manifest.total_pages ??
            "?";


        status.textContent =
            pageCount +
            " Seiten im Suchindex.";


        console.log(
            "TBS Search Index geladen:",
            manifest
        );


    } catch (error) {

        console.error(
            "Index konnte nicht geladen werden:",
            error
        );


        status.textContent =
            "Der Suchindex konnte nicht geladen werden.";


        document.getElementById(
            "results"
        ).innerHTML = `

            <div class="empty">

                <strong>
                    Der Suchindex konnte nicht geladen werden.
                </strong>

                <br><br>

                Prüfe, ob
                <code>data/index/manifest.json</code>
                vorhanden ist.

            </div>

        `;

    }

}



/* ============================================================
   SUCHEN
   ============================================================ */


async function search(query) {

    const terms =
        tokenize(query);


    if (!terms.length) {

        return [];

    }


    /*
     * Für jeden Begriff die Posting-Liste
     * laden.
     */

    const postingLists = [];


    for (const term of terms) {

        const postings =
            await getPostings(
                term
            );


        /*
         * Kein Dokument enthält
         * diesen Begriff.
         */

        if (!postings.length) {

            return [];

        }


        postingLists.push(
            postings
        );

    }


    /*
     * Die kleinste Liste zuerst.
     *
     * Das macht die Schnittmengenbildung
     * deutlich schneller.
     */

    postingLists.sort(
        (a, b) =>
            a.length - b.length
    );


    /*
     * Schnittmenge der Dokument-IDs.
     *
     * Dadurch müssen bei
     *
     * "linux tablet"
     *
     * nur Seiten geladen werden,
     * die beide Begriffe enthalten.
     */

    let ids =
        new Set(
            postingLists[0]
        );


    for (
        let i = 1;
        i < postingLists.length;
        i++
    ) {

        const current =
            new Set(
                postingLists[i]
            );


        ids =
            new Set(
                [...ids].filter(
                    id =>
                        current.has(id)
                )
            );


        if (!ids.size) {

            return [];

        }

    }


    const idArray =
        [...ids];


    /*
     * Dokumente laden.
     */

    const pages =
        await loadDocuments(
            idArray
        );


    /*
     * Ranking.
     */

    const results = [];


    for (const page of pages) {

        const score =
            calculateScore(
                page,
                terms
            );


        if (score > 0) {

            results.push({

                page: page,

                score: score

            });

        }

    }


    results.sort(
        (a, b) =>
            b.score - a.score
    );


    return results.slice(
        0,
        MAX_RESULTS
    );

}



/* ============================================================
   ERGEBNISSE DARSTELLEN
   ============================================================ */


function displayResults(
    results,
    query
) {

    const container =
        document.getElementById(
            "results"
        );


    const status =
        document.getElementById(
            "status"
        );


    container.innerHTML = "";


    if (!query.trim()) {

        const pageCount =
            manifest?.pages ??
            manifest?.documents ??
            manifest?.total_pages ??
            "?";


        status.textContent =
            pageCount +
            " Seiten im Suchindex.";


        return;

    }


    status.textContent =
        results.length +
        " Ergebnisse für „" +
        query +
        "“";


    if (!results.length) {

        container.innerHTML = `

            <div class="empty">

                Keine Ergebnisse für
                „${escapeHTML(query)}“
                gefunden.

            </div>

        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    for (const result of results) {

        const page =
            result.page;


        const article =
            document.createElement(
                "article"
            );


        article.className =
            "result";


        const title =
            page.title ||
            page.url ||
            "Unbekannte Seite";


        const snippet =
            createSnippet(
                page,
                tokenize(query)
            );


        const url =
            String(
                page.url || ""
            );


        article.innerHTML = `

            <h2 class="result-title">

                <a
                    href="${escapeHTML(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    ${escapeHTML(title)}

                </a>

            </h2>


            <div class="result-url">

                ${escapeHTML(url)}

            </div>


            <div class="result-description">

                ${escapeHTML(
                    snippet ||
                    page.description ||
                    "Keine Beschreibung verfügbar."
                )}

            </div>

        `;


        fragment.appendChild(
            article
        );

    }


    container.appendChild(
        fragment
    );

}



/* ============================================================
   SUCHEN MIT LOADING-STATUS
   ============================================================ */


async function performSearch(
    query
) {

    const status =
        document.getElementById(
            "status"
        );


    const resultsContainer =
        document.getElementById(
            "results"
        );


    const button =
        document.getElementById(
            "searchButton"
        );


    if (!query.trim()) {

        displayResults(
            [],
            ""
        );

        return;

    }


    button.disabled = true;


    status.innerHTML = `
        <span class="spinner"></span>
        Suche läuft...
    `;


    resultsContainer.innerHTML = "";


    try {

        const results =
            await search(
                query
            );


        displayResults(
            results,
            query
        );


    } catch (error) {

        console.error(
            "Suchfehler:",
            error
        );


        status.textContent =
            "Fehler bei der Suche.";


        resultsContainer.innerHTML = `

            <div class="empty">

                Bei der Suche ist ein Fehler aufgetreten.

                <br><br>

                <code>
                    ${escapeHTML(
                        error.message
                    )}
                </code>

            </div>

        `;

    }


    button.disabled = false;

}



/* ============================================================
   FORMULAR
   ============================================================ */


document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();


            if (!indexLoaded) {

                return;

            }


            const input =
                document.getElementById(
                    "searchInput"
                );


            const query =
                input.value.trim();


            /*
             * URL aktualisieren.
             */

            const url =
                new URL(
                    window.location.href
                );


            if (query) {

                url.searchParams.set(
                    "q",
                    query
                );

            } else {

                url.searchParams.delete(
                    "q"
                );

            }


            history.replaceState(
                null,
                "",
                url
            );


            performSearch(
                query
            );

        }
    );



/* ============================================================
   URL-SUCHE
   ============================================================ */


function searchFromURL() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const query =
        params.get("q");


    if (!query) {

        return;

    }


    const input =
        document.getElementById(
            "searchInput"
        );


    input.value =
        query;


    if (indexLoaded) {

        performSearch(
            query
        );

    }

}



/* ============================================================
   START
   ============================================================ */


loadIndex().then(
    searchFromURL
);

</script>


</body>

</html>
