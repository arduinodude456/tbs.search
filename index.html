<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TBS Search</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #fff;
    color: #202124;
}


/* =========================
   HEADER
   ========================= */

header {
    padding: 70px 20px 30px;
    text-align: center;
}

.logo {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 28px;
}

.search-container {
    width: 100%;
    max-width: 720px;
    margin: auto;
}

.search-box {
    display: flex;
    width: 100%;
}

#searchInput {
    flex: 1;
    min-width: 0;

    height: 52px;

    padding: 0 18px;

    border: 1px solid #c7c7c7;
    border-right: none;

    border-radius: 26px 0 0 26px;

    font-size: 17px;

    outline: none;
}

#searchInput:focus {
    border-color: #4285f4;
}

#searchButton {
    height: 52px;

    padding: 0 25px;

    border: none;

    border-radius: 0 26px 26px 0;

    background: #4285f4;
    color: white;

    font-size: 16px;

    cursor: pointer;
}

#searchButton:hover {
    background: #3367d6;
}

#searchButton:disabled {
    opacity: 0.6;
    cursor: default;
}


/* =========================
   STATUS
   ========================= */

#status {
    max-width: 900px;

    margin: 20px auto 10px;

    padding: 0 20px;

    color: #70757a;

    font-size: 14px;
}


/* =========================
   RESULTS
   ========================= */

#results {
    max-width: 900px;

    margin: 0 auto;

    padding: 10px 20px 50px;
}

.result {
    margin-bottom: 27px;
}

.result-title {
    margin: 0;

    font-size: 20px;
    font-weight: 500;
}

.result-title a {
    color: #1a0dab;
    text-decoration: none;
}

.result-title a:hover {
    text-decoration: underline;
}

.result-url {
    margin: 4px 0;

    color: #188038;

    font-size: 14px;

    word-break: break-all;
}

.result-description {
    color: #4d5156;

    line-height: 1.5;

    font-size: 15px;

    max-width: 750px;
}

.empty {
    padding: 50px 20px;

    text-align: center;

    color: #777;
}


/* =========================
   LOADING
   ========================= */

.loading {
    padding: 40px 20px;

    text-align: center;

    color: #70757a;
}

.spinner {
    display: inline-block;

    width: 18px;
    height: 18px;

    margin-right: 8px;

    border: 2px solid #ddd;
    border-top-color: #4285f4;

    border-radius: 50%;

    vertical-align: -4px;

    animation: spin 0.8s linear infinite;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    header {
        padding-top: 35px;
    }

    .logo {
        font-size: 38px;
    }

    #searchInput {
        font-size: 16px;
    }

    #searchButton {
        padding: 0 18px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        TBS Search
    </div>

    <div class="search-container">

        <form
            id="searchForm"
            class="search-box"
        >

            <input
                id="searchInput"
                type="search"
                placeholder="Das Web durchsuchen..."
                autocomplete="off"
                spellcheck="false"
            >

            <button
                id="searchButton"
                type="submit"
            >
                Suchen
            </button>

        </form>

    </div>

</header>


<div id="status">
    Suchindex wird geladen...
</div>


<main id="results"></main>


<script>

"use strict";


/* ============================================================
   KONFIGURATION
   ============================================================ */

const INDEX_ROOT = "data/index";

const PAGES_ROOT = "data/pages";

const MANIFEST_FILE =
    INDEX_ROOT + "/manifest.json";

const MAX_RESULTS = 100;

const MAX_DOCUMENTS_TO_LOAD = 300;

const MAX_TERMS = 10;


/*
 * ============================================================
 * WICHTIG:
 *
 * Dieser Wert wird bei JEDEM vollständigen Seitenaufruf
 * neu erzeugt.
 *
 * Dadurch sind auch zwei Reloads niemals dieselbe Anfrage.
 * ============================================================
 */

const RELOAD_ID =
    Date.now().toString() +
    "-" +
    Math.random()
        .toString(36)
        .substring(2);


/* ============================================================
   NEUER IN-MEMORY-INDEX
   ============================================================ */

/*
 * Diese Maps existieren nur für diesen einen Seitenaufruf.
 *
 * Nach einem Reload sind sie automatisch leer.
 */

let manifest = null;

const termShardCache =
    new Map();

const documentShardCache =
    new Map();

const documentCache =
    new Map();


let indexLoaded = false;


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   TEXT NORMALISIEREN
   ============================================================ */

function normalizeText(value) {

    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* ============================================================
   SUCHBEGRIFFE
   ============================================================ */

function tokenize(query) {

    return normalizeText(query)
        .split(/\s+/)

        .map(term =>
            term
                .replace(
                    /[^\p{L}\p{N}_-]/gu,
                    ""
                )
                .trim()
        )

        .filter(Boolean)

        .slice(0, MAX_TERMS);

}


/* ============================================================
   FRISCHE URL FÜR JEDE INDEX-DATEI
   ============================================================ */

function freshURL(path) {

    const separator =
        path.includes("?")
            ? "&"
            : "?";

    return (
        path +
        separator +
        "reload=" +
        encodeURIComponent(RELOAD_ID) +
        "&random=" +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


/* ============================================================
   FRISCHEN FETCH AUSFÜHREN
   ============================================================ */

async function freshFetch(path) {

    const url =
        freshURL(path);

    console.log(
        "TBS Search lädt:",
        url
    );


    const response =
        await fetch(
            url,
            {
                method: "GET",

                /*
                 * Browser darf die Antwort nicht aus
                 * seinem normalen HTTP-Cache nehmen.
                 */

                cache: "no-store",

                /*
                 * Zusätzliche Cache-Header-Anweisung.
                 */

                headers: {
                    "Cache-Control":
                        "no-cache, no-store, max-age=0",
                    "Pragma":
                        "no-cache"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            path +
            " → HTTP " +
            response.status
        );

    }


    return response;

}


/* ============================================================
   SHA-256
   ============================================================ */

async function sha256(text) {

    const data =
        new TextEncoder()
            .encode(text);


    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    const bytes =
        new Uint8Array(hash);


    return Array.from(bytes)

        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )

        .join("");

}


/* ============================================================
   MANIFEST LADEN
   ============================================================ */

async function loadIndex() {

    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML = `
        <span class="spinner"></span>
        Neuer Suchindex wird geladen...
    `;


    /*
     * WICHTIG:
     *
     * Manifest wird bei jedem Reload komplett
     * neu angefordert.
     */

    const response =
        await freshFetch(
            MANIFEST_FILE
        );


    manifest =
        await response.json();


    if (
        !manifest ||
        typeof manifest !== "object"
    ) {

        throw new Error(
            "manifest.json ist ungültig."
        );

    }


    indexLoaded = true;


    const count =
        manifest.pages ??
        manifest.documents ??
        manifest.total_pages ??
        "?";


    status.textContent =
        count +
        " Seiten im frisch geladenen Suchindex.";


    console.log(
        "TBS Search: neuer Index geladen",
        manifest
    );

}


/* ============================================================
   TERM-SHARD
   ============================================================ */

async function getTermShard(term) {

    const normalized =
        normalizeText(term);


    const hash =
        await sha256(
            normalized
        );


    const shard =
        hash.substring(
            0,
            2
        );


    /*
     * Cache existiert nur innerhalb dieses
     * Seitenaufrufs.
     */

    if (
        termShardCache.has(shard)
    ) {

        return termShardCache.get(
            shard
        );

    }


    const path =
        INDEX_ROOT +
        "/terms/" +
        shard +
        ".json";


    let response;


    try {

        response =
            await freshFetch(
                path
            );

    } catch (error) {

        /*
         * Ein nicht vorhandener Term-Shard
         * bedeutet einfach: keine Treffer.
         */

        if (
            error.message.includes(
                "HTTP 404"
            )
        ) {

            const empty = {};

            termShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw error;

    }


    const data =
        await response.json();


    termShardCache.set(
        shard,
        data
    );


    return data;

}


/* ============================================================
   POSTINGS
   ============================================================ */

async function getPostings(term) {

    const shard =
        await getTermShard(
            term
        );


    const key =
        normalizeText(term);


    const postings =
        shard[key];


    if (
        !Array.isArray(postings)
    ) {

        return [];

    }


    return postings;

}


/* ============================================================
   DOKUMENT-SHARD
   ============================================================ */

async function getDocumentShard(
    shard
) {

    if (
        documentShardCache.has(shard)
    ) {

        return documentShardCache.get(
            shard
        );

    }


    const path =
        PAGES_ROOT +
        "/" +
        shard +
        ".json";


    let response;


    try {

        response =
            await freshFetch(
                path
            );

    } catch (error) {

        if (
            error.message.includes(
                "HTTP 404"
            )
        ) {

            const empty = {};

            documentShardCache.set(
                shard,
                empty
            );

            return empty;

        }


        throw error;

    }


    const data =
        await response.json();


    documentShardCache.set(
        shard,
        data
    );


    return data;

}


/* ============================================================
   DOKUMENTE LADEN
   ============================================================ */

async function loadDocuments(ids) {

    const result = [];


    const limitedIds =
        ids.slice(
            0,
            MAX_DOCUMENTS_TO_LOAD
        );


    const missingIds = [];


    for (
        const id
        of limitedIds
    ) {

        if (
            documentCache.has(id)
        ) {

            result.push(
                documentCache.get(id)
            );

        } else {

            missingIds.push(id);

        }

    }


    /*
     * Dokumente nach Shard gruppieren.
     */

    const groups =
        new Map();


    for (
        const id
        of missingIds
    ) {

        const shard =
            String(id)
                .substring(
                    0,
                    2
                );


        if (
            !groups.has(shard)
        ) {

            groups.set(
                shard,
                []
            );

        }


        groups
            .get(shard)
            .push(id);

    }


    /*
     * Benötigte Shards frisch laden.
     */

    for (
        const [
            shard,
            shardIds
        ]
        of groups
    ) {

        const documents =
            await getDocumentShard(
                shard
            );


        for (
            const id
            of shardIds
        ) {

            const page =
                documents[id];


            if (!page) {
                continue;
            }


            documentCache.set(
                id,
                page
            );


            result.push(
                page
            );

        }

    }


    return result;

}


/* ============================================================
   VORKOMMEN ZÄHLEN
   ============================================================ */

function countOccurrences(
    text,
    term
) {

    if (!term) {
        return 0;
    }


    let count = 0;

    let position = 0;


    while (true) {

        const found =
            text.indexOf(
                term,
                position
            );


        if (
            found === -1
        ) {

            break;

        }


        count++;


        position =
            found + term.length;

    }


    return count;

}


/* ============================================================
   RANKING
   ============================================================ */

function calculateScore(
    page,
    terms
) {

    const title =
        normalizeText(
            page.title
        );


    const description =
        normalizeText(
            page.description
        );


    const text =
        normalizeText(
            page.text
        );


    const url =
        normalizeText(
            page.url
        );


    const headings =
        normalizeText(
            Array.isArray(
                page.headings
            )
                ? page.headings.join(" ")
                : ""
        );


    let score = 0;


    for (
        const term
        of terms
    ) {

        if (
            title === term
        ) {

            score += 100;

        }

        else if (
            title.includes(term)
        ) {

            score += 40;

        }


        if (
            headings.includes(term)
        ) {

            score += 20;

        }


        if (
            url.includes(term)
        ) {

            score += 10;

        }


        if (
            description.includes(term)
        ) {

            score += 12;

        }


        if (
            text.includes(term)
        ) {

            score += 3;


            score += Math.min(
                countOccurrences(
                    text,
                    term
                ) * 0.25,
                10
            );

        }

    }


    if (
        terms.every(
            term =>
                title.includes(term)
        )
    ) {

        score += 50;

    }


    return score;

}


/* ============================================================
   SNIPPET
   ============================================================ */

function createSnippet(
    page,
    terms
) {

    const text =
        String(
            page.text || ""
        );


    if (!text) {

        return (
            page.description ||
            ""
        );

    }


    const normalized =
        normalizeText(
            text
        );


    let position = -1;


    for (
        const term
        of terms
    ) {

        const found =
            normalized.indexOf(
                term
            );


        if (
            found !== -1
        ) {

            position =
                found;

            break;

        }

    }


    if (
        position === -1
    ) {

        return (
            text.substring(
                0,
                300
            ) +
            (
                text.length > 300
                    ? "…"
                    : ""
            )
        );

    }


    const start =
        Math.max(
            0,
            position - 100
        );


    const end =
        Math.min(
            text.length,
            start + 300
        );


    let snippet =
        text.substring(
            start,
            end
        );


    if (
        start > 0
    ) {

        snippet =
            "…" +
            snippet;

    }


    if (
        end < text.length
    ) {

        snippet += "…";

    }


    return snippet;

}


/* ============================================================
   SUCHE
   ============================================================ */

async function search(query) {

    const terms =
        tokenize(query);


    if (
        !terms.length
    ) {

        return [];

    }


    const postingLists = [];


    for (
        const term
        of terms
    ) {

        const postings =
            await getPostings(
                term
            );


        if (
            !postings.length
        ) {

            return [];

        }


        postingLists.push(
            postings
        );

    }


    /*
     * Kleinste Posting-Liste zuerst.
     */

    postingLists.sort(
        (a, b) =>
            a.length - b.length
    );


    let ids =
        new Set(
            postingLists[0]
        );


    /*
     * Schnittmenge bilden.
     */

    for (
        let i = 1;
        i < postingLists.length;
        i++
    ) {

        const current =
            new Set(
                postingLists[i]
            );


        ids =
            new Set(
                [...ids]
                    .filter(
                        id =>
                            current.has(id)
                    )
            );


        if (
            !ids.size
        ) {

            return [];

        }

    }


    /*
     * Dokumente frisch aus den
     * Dokument-Shards laden.
     */

    const pages =
        await loadDocuments(
            [...ids]
        );


    const results = [];


    for (
        const page
        of pages
    ) {

        const score =
            calculateScore(
                page,
                terms
            );


        if (
            score > 0
        ) {

            results.push({
                page,
                score
            });

        }

    }


    results.sort(
        (a, b) =>
            b.score - a.score
    );


    return results.slice(
        0,
        MAX_RESULTS
    );

}


/* ============================================================
   ERGEBNISSE ANZEIGEN
   ============================================================ */

function displayResults(
    results,
    query
) {

    const container =
        document.getElementById(
            "results"
        );


    const status =
        document.getElementById(
            "status"
        );


    container.innerHTML = "";


    if (
        !query.trim()
    ) {

        const count =
            manifest?.pages ??
            manifest?.documents ??
            manifest?.total_pages ??
            "?";


        status.textContent =
            count +
            " Seiten im Suchindex.";


        return;

    }


    status.textContent =
        results.length +
        " Ergebnisse für „" +
        query +
        "“";


    if (
        !results.length
    ) {

        container.innerHTML = `

            <div class="empty">

                Keine Ergebnisse für
                „${escapeHTML(query)}“
                gefunden.

            </div>

        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    for (
        const result
        of results
    ) {

        const page =
            result.page;


        const article =
            document.createElement(
                "article"
            );


        article.className =
            "result";


        const title =
            page.title ||
            page.url ||
            "Unbekannte Seite";


        const snippet =
            createSnippet(
                page,
                tokenize(query)
            );


        const url =
            String(
                page.url || ""
            );


        article.innerHTML = `

            <h2 class="result-title">

                <a
                    href="${escapeHTML(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${escapeHTML(title)}
                </a>

            </h2>

            <div class="result-url">
                ${escapeHTML(url)}
            </div>

            <div class="result-description">
                ${escapeHTML(
                    snippet ||
                    page.description ||
                    "Keine Beschreibung verfügbar."
                )}
            </div>

        `;


        fragment.appendChild(
            article
        );

    }


    container.appendChild(
        fragment
    );

}


/* ============================================================
   SUCHFORMULAR
   ============================================================ */

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (
                !indexLoaded
            ) {

                return;

            }


            const input =
                document.getElementById(
                    "searchInput"
                );


            const query =
                input.value.trim();


            /*
             * Die Suchanfrage wird NICHT in der URL
             * gespeichert.
             *
             * Nach einem Reload ist die Seite wieder
             * komplett leer.
             */

            history.replaceState(
                null,
                "",
                window.location.pathname
            );


            await performSearch(
                query
            );

        }
    );


/* ============================================================
   SUCHE AUSFÜHREN
   ============================================================ */

async function performSearch(
    query
) {

    const status =
        document.getElementById(
            "status"
        );


    const results =
        document.getElementById(
            "results"
        );


    const button =
        document.getElementById(
            "searchButton"
        );


    query =
        query.trim();


    if (!query) {

        displayResults(
            [],
            ""
        );

        return;

    }


    button.disabled = true;


    status.innerHTML = `
        <span class="spinner"></span>
        Suche im frisch geladenen Index...
    `;


    results.innerHTML = "";


    try {

        const found =
            await search(
                query
            );


        displayResults(
            found,
            query
        );


    } catch (error) {

        console.error(
            "TBS Search Fehler:",
            error
        );


        status.textContent =
            "Fehler bei der Suche.";


        results.innerHTML = `

            <div class="empty">

                <strong>
                    Fehler beim Laden des Index.
                </strong>

                <br><br>

                <code>
                    ${escapeHTML(
                        error.message
                    )}
                </code>

            </div>

        `;

    }


    button.disabled = false;

}


/* ============================================================
   START
   ============================================================ */

/*
 * Beim Öffnen der Seite:
 *
 * 1. Browser startet neues JavaScript.
 * 2. Alle Maps sind leer.
 * 3. Neuer RELOAD_ID wird erzeugt.
 * 4. Manifest wird neu geladen.
 * 5. Kein alter Suchbegriff wird übernommen.
 *
 * Genau wie ein erster Besuch.
 */

async function start() {

    try {

        /*
         * Suchfeld ausdrücklich leeren.
         */

        document
            .getElementById(
                "searchInput"
            )
            .value = "";


        /*
         * Ergebnisse ausdrücklich leeren.
         */

        document
            .getElementById(
                "results"
            )
            .innerHTML = "";


        /*
         * Alten URL-Parameter entfernen.
         */

        if (
            window.location.search
        ) {

            history.replaceState(
                null,
                "",
                window.location.pathname
            );

        }


        /*
         * FRISCHEN INDEX LADEN.
         */

        await loadIndex();


        /*
         * Nach dem Laden NICHT automatisch suchen.
         */

        document
            .getElementById(
                "status"
            )
            .textContent =
                (
                    manifest?.pages ??
                    manifest?.documents ??
                    manifest?.total_pages ??
                    "?"
                ) +
                " Seiten im Suchindex. Bereit.";


        console.log(
            "TBS Search bereit.",
            "Reload-ID:",
            RELOAD_ID
        );

    } catch (error) {

        console.error(
            "TBS Search Startfehler:",
            error
        );


        document
            .getElementById(
                "status"
            )
            .textContent =
                "Suchindex konnte nicht geladen werden.";


        document
            .getElementById(
                "results"
            )
            .innerHTML = `

                <div class="empty">

                    <strong>
                        Index konnte nicht geladen werden.
                    </strong>

                    <br><br>

                    <code>
                        ${escapeHTML(
                            error.message
                        )}
                    </code>

                </div>

            `;

    }

}
